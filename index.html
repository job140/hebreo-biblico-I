function btDecompose(w){
 const form=btPlain(w.he),parts=[];
 if(w.cat==='verb'&&/wayyiqtol/i.test(w.gram))parts.push(['bt-part','וַ־','marca verbal narrativa (wayyiqtol)']);
 else if(form.startsWith('ו')&&form.length>2)parts.push(['bt-part','וְ / וּ','conjunción «y» (cuando funciona como prefijo)']);
 if(w.cat!=='verb'&&w.cat!=='part'){
  let start=form.startsWith('ו')?form.slice(1):form;
  if(/^[בלכ]/.test(start)&&start.length>2&&w.cat!=='pron')parts.push(['bt-prep',start[0]+'ְ־','posible preposición inseparable; revisa las vocales']);
  else if(start.startsWith('מ')&&start.length>3&&w.cat!=='pron')parts.push(['bt-prep','מִן / מִ־','posible «de / desde»; confirma según el contexto']);
  if((start.startsWith('ה')||/^[בלכ]ה/.test(start))&&w.cat!=='prep')parts.push(['bt-part','הַ / הָ','posible artículo definido']);
 }
 if(w.cat==='verb'&&/qatal/i.test(w.gram))parts.push(['bt-verb','Qatal','identifica terminación, persona y número']);
 if(w.cat==='verb'&&/imperfecto/i.test(w.gram))parts.push(['bt-verb','Yiqtol','identifica la persona por prefijos y sufijos verbales']);
 if(/sufijo/i.test(w.gram)||/כ[םן]$|נו$|ך$|הם$/.test(form))parts.push(['bt-pron','Sufijo','puede indicar objeto o poseedor; revisa el análisis']);
 if(!parts.length)parts.push(['bt-noun','Raíz / base','relaciona esta forma con su significado y su función en la oración']);
 return `<div class="bt-decompose"><span class="bt-overline">PISTAS PARA DESCOMPONER</span><div>${parts.map(([css,he,meaning])=>`<span class="bt-decomp-chip ${css}"><b>${btHtml(he)}</b><small>${btHtml(meaning)}</small></span>`).join('')}</div></div>`;
}

function btExplorer(){const v=btVerse();return `<div class="bt-explore-layout"><section class="bt-surface">${btVerseSelector()}<div class="bt-controls"><label class="bt-toggle"><input type="checkbox" data-bt-niq ${BT_STATE.showNiq?'checked':''}> Vocales</label><label class="bt-toggle"><input type="checkbox" data-bt-cant ${BT_STATE.showCant?'checked':''}> Acentos</label><label class="bt-toggle"><input type="checkbox" data-bt-mask ${BT_STATE.maskColors?'checked':''}> Sin pistas de color</label><label class="bt-toggle"><input type="checkbox" data-bt-trans ${BT_STATE.showTranslation?'checked':''}> Traducción</label><select id="bt-filter" aria-label="Colores por categoría"><option value="all">Todas las categorías</option>${Object.entries(BT_CATS).map(([k,a])=>`<option value="${k}" ${BT_STATE.focus===k?'selected':''}>Resaltar ${a[0].toLowerCase()}</option>`).join('')}</select></div><div class="bt-taglegend compact">${Object.entries(BT_CATS).map(([k,a])=>`<button class="bt-leg bt-${k}" data-bt-focus="${k}" aria-pressed="${BT_STATE.focus===k}"><i></i>${a[0]}</button>`).join('')}<button class="bt-leg" data-bt-focus="all">Todos</button></div>${btWordList()}<div class="bt-translation ${BT_STATE.showTranslation?'visible':''}"><span class="bt-overline">TRADUCCIÓN DE ESTUDIO</span><p>${BT_STATE.showTranslation?btHtml(v.es):'La traducción está oculta. Intenta identificar primero el verbo, el sujeto y los complementos.'}</p></div><div class="bt-actions bt-between"><button class="bt-secondary" data-bt-say="${btHtml(v.he)}">♫ Escuchar versículo</button><button class="bt-primary" data-bt-mark="1">${btCompleted(BT_STATE.book,BT_STATE.v)?'✓ Estudiado · desmarcar':'Marcar como estudiado'}</button></div></section><aside class="bt-explore-side"><section class="bt-surface"><span class="bt-overline">DESARMA LA PALABRA</span>${btInspector()}</section><section class="bt-surface bt-tip"><span class="bt-overline">CLAVE DE ESTE VERSÍCULO</span>${btPhrase(v.focus)}<p>${btHtml(v.note)}</p><button class="bt-secondary" data-bt-mode="translate">Practicar su traducción →</button></section></aside></div>`}
function btWordCards(){const src=btBook().verses.flatMap(v=>v.words.filter(w=>w.cat!=='other'&&w.es!=='Consulta la traducción del versículo'));const seen=new Set();const out=[];for(const w of src){const id=w.cat+':'+btPlain(w.he);if(!seen.has(id)){seen.add(id);out.push({id,he:w.he,gloss:w.es,cat:w.cat,gram:w.gram})}}return out}
function btPlain(t){return String(t).replace(/[\u0591-\u05c7׃׀־]/g,'')}
function btFlash(){const words=btWordCards(),idx=BT_STATE.cardIdx%words.length,w=words[idx],state=btSaveGet(),mem=state.cards||{},known=Object.values(mem).filter(Boolean).length;return `<section class="bt-surface"><div class="bt-section-title"><div><span class="bt-overline">RECUPERACIÓN ACTIVA</span><h2>Tarjetas del capítulo · ${btBook().title}</h2><p>Antes de ver el significado, intenta decirlo en voz alta. Califica tu memoria sin mirar apuntes.</p></div></div><div class="bt-flash-stats"><span>Tarjeta ${idx+1} / ${words.length}</span><span>${known} calificaciones guardadas</span></div><button class="bt-flash ${BT_STATE.cardFlip?'flipped':''}" id="bt-flash" data-bt-flip="1" aria-label="${BT_STATE.cardFlip?'Ver palabra':'Revelar significado'}"><span>${BT_CATS[w.cat][0]}</span>${btSmallHeb(w.he)}${BT_STATE.cardFlip?`<strong>${btHtml(w.gloss)}</strong><small>${btHtml(w.gram)}</small>`:'<small>Toca para descubrir el significado</small>'}</button><div class="bt-flash-actions"><button data-bt-rate="again" ${BT_STATE.cardFlip?'':'disabled'}>↻ Otra vez</button><button data-bt-rate="good" ${BT_STATE.cardFlip?'':'disabled'}>✓ Bien</button><button data-bt-rate="easy" ${BT_STATE.cardFlip?'':'disabled'}>✦ Fácil</button></div><div class="bt-actions"><button class="bt-secondary" data-bt-flashprev="1">← Anterior</button><button class="bt-secondary" data-bt-flashnext="1">Siguiente →</button><button class="bt-secondary" data-bt-say="${btHtml(w.he)}">♫ Escuchar</button></div></section>`}
function btPieces(){const t=btVerse().es.trim().replace(/[«»]/g,'');const a=t.split(/\s+/);const size=Math.max(1,Math.ceil(a.length/5));const chunks=[];for(let i=0;i<a.length;i+=size)chunks.push(a.slice(i,i+size).join(' '));return chunks.length>1?chunks:[t]}
function btPermutation(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=(i*7+BT_STATE.v*13+3)%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.every((x,i)=>x===i)&&n>1)a.reverse();return a}
function btBuilder(){const parts=btPieces(),shuffled=btPermutation(parts.length);const available=shuffled.filter(i=>!BT_STATE.pieces.includes(i));const complete=BT_STATE.pieces.length===parts.length,success=complete&&BT_STATE.pieces.every((i,j)=>i===j);return `<section class="bt-surface">${btVerseSelector()}<span class="bt-overline">CONSTRUCCIÓN DE TRADUCCIÓN</span><h2>Ordena las partes de la oración</h2><p class="bt-muted">Lee el hebreo. Toca los fragmentos en español en el orden que corresponda; luego compara con el versículo.</p><div class="bt-standalone-he">${btPhrase(btVerse().he)}</div><div class="bt-built">${BT_STATE.pieces.length?BT_STATE.pieces.map((i,j)=>`<button data-bt-unbuild="${j}">${btHtml(parts[i])}<span>×</span></button>`).join(''):'<span>Tu traducción se construirá aquí...</span>'}</div><div class="bt-piece-pool">${available.map(i=>`<button data-bt-build="${i}">${btHtml(parts[i])}</button>`).join('')}</div><div class="bt-actions"><button class="bt-secondary" data-bt-clearbuild="1">Limpiar</button><button class="bt-primary" data-bt-checkbuild="1" ${!complete?'disabled':''}>Comprobar orden</button></div>${BT_STATE.buildChecked?`<div class="bt-feedback ${success?'good':'review'}"><strong>${success?'✓ ¡Construcción correcta!':'↻ Revisa el orden de las ideas'}</strong><p>${btHtml(btVerse().es)}</p><p>${btHtml(btVerse().note)}</p></div>`:''}<div class="bt-tip">Este ejercicio trabaja el <b>orden de los fragmentos en español</b>. Para traducir desde cero, pasa después a «Traducir».</div></section>`}
function btKeywords(s){return [...new Set(String(s).toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ ]/g,' ').split(/\s+/).filter(x=>x.length>3&&!BT_STOP.has(x)))];}
function btCompare(a,b){const tokens=btKeywords(a),target=btKeywords(b);return {matched:target.filter(k=>tokens.some(x=>x===k||x.startsWith(k.slice(0,Math.max(4,k.length-2))))),target};}
function btTranslate(){const v=btVerse(),cmp=btCompare(BT_STATE.draft,v.es),fraction=cmp.target.length?Math.round(100*cmp.matched.length/cmp.target.length):0;return `<section class="bt-surface">${btVerseSelector()}<div class="bt-section-title"><div><span class="bt-overline">SIMULACIÓN DE EXAMEN ESCRITO</span><h2>Traduce este versículo sin pistas</h2><p>Escribe en español el significado que entiendes del texto. Puedes redactarlo con tus propias palabras.</p></div></div><div class="bt-standalone-he">${btPhrase(v.he)}</div><div class="bt-translate-form"><label for="bt-translate-input">Tu traducción</label><textarea id="bt-translate-input" rows="5" placeholder="Escribe aquí tu traducción al español…">${btHtml(BT_STATE.draft)}</textarea><div class="bt-actions"><button class="bt-primary" data-bt-checktranslate="1">Comparar con la respuesta</button><button class="bt-secondary" data-bt-say="${btHtml(v.he)}">♫ Escuchar</button></div></div>${BT_STATE.draftChecked?`<div class="bt-feedback"><span class="bt-overline">AUTOEVALUACIÓN</span><h3>Compara el sentido, no solo las palabras</h3><p><strong>Traducción de estudio:</strong> ${btHtml(v.es)}</p><p><strong>Palabras clave detectadas:</strong> ${fraction}% de coincidencia literal orientativa (${cmp.matched.length}/${cmp.target.length}). Los sinónimos pueden no coincidir: <b>no es una nota automática fiable</b>.</p><p class="bt-muted">${btHtml(v.note)}</p><div class="bt-actions"><button class="bt-primary" data-bt-self="good">Sí, transmití correctamente el sentido ✓</button><button class="bt-secondary" data-bt-self="repeat">Necesito volver a practicar ↻</button></div></div>`:''}<div class="bt-tip"><strong>Consejo:</strong> busca el verbo principal, el sujeto, las partículas y las construcciones con sufijos. No traduzcas literalmente cada «y» o cada אֵת sin examinar su función.</div></section>`}
function btExamQuestionPool(){let pool=[];for(const [book,ch] of Object.entries(BT_CORPUS))for(const verse of ch.verses){for(const w of verse.words){if(w.cat==='other'||w.es.length>47||w.es.startsWith('Consulta')||w.es.includes(' / '))continue;const same=ch.verses.flatMap(v=>v.words).filter(x=>x.cat===w.cat&&x.es!==w.es&&x.es.length<47&&x.es.length>2);const unique=[...new Map(same.map(x=>[x.es,x])).values()];if(unique.length<3)continue;pool.push({book,verse:verse.n,he:w.he,cat:w.cat,answer:w.es,why:w.gram,others:unique.map(x=>x.es)})}}return pool}
let btExamSet=[];
function btNewExam(){const pool=btExamQuestionPool();const chosen=[];const seen=new Set();let seed=23;while(chosen.length<20&&seed<4000){const p=pool[(seed*17+Math.floor(seed/3)*13)%pool.length];seed+=7;const key=p.book+':'+btPlain(p.he);if(seen.has(key))continue;seen.add(key);const others=p.others.slice(0,3),opts=[p.answer,...others],offset=chosen.length%4;opts.unshift(...opts.splice((offset+1)%4));chosen.push({...p,opts,correct:opts.indexOf(p.answer)})}btExamSet=chosen;BT_STATE.examIdx=0;BT_STATE.examChoice=-1;BT_STATE.examResults=[];BT_STATE.examDone=false;}
function btExam(){if(!btExamSet.length)btNewExam();if(BT_STATE.examDone){const total=btExamSet.length,correct=BT_STATE.examResults.filter(Boolean).length,pct=Math.round(correct/total*100);return `<section class="bt-surface bt-exam-end"><span>🏆</span><span class="bt-overline">SIMULACRO COMPLETADO</span><h2>${correct}/${total} respuestas correctas</h2><div class="bt-exam-score">${pct}<small>%</small></div><p>Las preguntas procedían de los capítulos disponibles. Una puntuación alta en reconocimiento es una buena señal, pero el examen escrito exige traducir oraciones completas.</p><div class="bt-actions"><button class="bt-primary" data-bt-newexam="1">Repetir otro simulacro →</button><button class="bt-secondary" data-bt-mode="translate">Traducir por escrito</button></div></section>`}
const idx=BT_STATE.examIdx,item=btExamSet[idx],marked=BT_STATE.examChoice>=0;return `<section class="bt-surface bt-exam"><div class="bt-exam-head"><div><span class="bt-overline">EXAMEN SIN PISTAS</span><h2>Pregunta ${idx+1} de ${btExamSet.length}</h2></div><span>${BT_STATE.examResults.filter(Boolean).length} aciertos</span></div><div class="bt-exam-bar"><i style="width:${Math.floor(idx/btExamSet.length*100)}%"></i></div><p class="bt-muted">${BT_CORPUS[item.book].title}:${item.verse} · ¿Cuál es el significado orientativo de esta forma?</p><div class="bt-exam-word">${btSmallHeb(item.he)}</div><div class="bt-exam-options">${item.opts.map((o,i)=>`<button data-bt-answer="${i}" ${marked?'disabled':''} class="${marked&&i===item.correct?'is-right':marked&&i===BT_STATE.examChoice?'is-wrong':''}"><small>${String.fromCharCode(65+i)}</small>${btHtml(o)}</button>`).join('')}</div>${marked?`<div class="bt-feedback ${BT_STATE.examChoice===item.correct?'good':'review'}"><b>${BT_STATE.examChoice===item.correct?'✓ Correcto':'↻ Repasa la forma'}</b><p>Significa «${btHtml(item.answer)}». ${btHtml(item.why)}</p></div><div class="bt-actions"><button class="bt-primary" data-bt-examnext="1">${idx===btExamSet.length-1?'Ver resultado':'Siguiente pregunta'} →</button></div>`:''}</section>`}
function vBibleTranslation(){const el=btRoot();if(!el)return;el.classList.add('bt-root');el.innerHTML=`<div class="bt-app">${btHeading()}${btNav()}${btBooks()}<div id="bt-area">${BT_STATE.mode==='study'?btLessons():BT_STATE.mode==='explore'?btExplorer():BT_STATE.mode==='cards'?btFlash():BT_STATE.mode==='build'?btBuilder():BT_STATE.mode==='translate'?btTranslate():btExam()}</div><footer class="bt-credit">Texto hebreo: <a href="https://ebible.org/hebwlc/" target="_blank" rel="noopener">Westminster Leningrad Codex</a> (dominio público). Análisis didáctico complementado con terminología de <a href="https://hb.openscriptures.org/HomeFiles/Oshb.html" target="_blank" rel="noopener">Open Scriptures Hebrew Bible</a> (CC BY 4.0). Traducciones españolas redactadas para esta guía, no una reproducción de una traducción comercial. Las etiquetas morfológicas son orientativas y deben cotejarse con gramáticas especializadas cuando una forma sea ambigua.</footer></div>`;btWire(el)}

n de estudio</summary><p>Dichoso el hombre que no anduvo en el consejo de los malvados, ni se detuvo en el camino de los pecadores, ni se sentó en la reunión de los burladores.</p></details></section><section class="qt-prof-panel"><h3>Rastrear las formas en Génesis 12</h3><p class="qt-prof-intro">La diapositiva 38 pide ubicar los verbos perfectos y distinguir voz, persona y función. Empieza por estos ejemplos del capítulo; no confundas qatal, imperativo y wayyiqtol.</p><div class="qt-prof-pairs">${PF_G12.map(x=>`<div class="qt-prof-pair"><div>${pfHe(x.he)}<small>${x.ref}</small></div><span class="qt-prof-arrow">→</span><div><b>${x.meaning}</b><small>${x.parse}</small></div></div>`).join('')}</div><div class="qt-prof-tip"><b>Cómo responder en el examen:</b> «${PF_G12[2].he}: raíz דבר; Piel; qatal/perfecto; tercera persona masculina singular; “habló”».</div></section>`}

      button.type = 'button';
      button.className = 'hb-check-update';
      button.textContent = '↻ Buscar actualización';
      button.setAttribute('aria-label','Buscar una nueva versión de Hebreo Bíblico I');
      button.addEventListener('click', async () => {
        button.textContent = 'Comprobando…';
        try {
          if (!navigator.onLine) { button.textContent = 'Sin conexión'; return; }
          await checkForUpdate(true);
          button.textContent = registration?.waiting ? 'Actualización disponible' : 'Comprobación terminada';
        } catch (err) { button.textContent = 'No se pudo comprobar'; }
        finally { window.setTimeout(() => {button.textContent = '↻ Buscar actualización';}, 2800); }
      });
      pills.appendChild(button);
    }
  }
  function showAvailable() {
    elements();
    if (!deferred) document.getElementById('hb-update-banner')?.classList.add('show');
  }
  function observe(reg) {
    registration = reg;
    if (reg.waiting && navigator.serviceWorker.controller) showAvailable();
    reg.addEventListener('updatefound', () => {
      const installing = reg.installing;
      if (!installing) return;
      installing.addEventListener('statechange', () => {
        if (installing.state === 'installed' && navigator.serviceWorker.controller) {
          deferred = false;
          showAvailable();
        }
      });
    });
  }
  async function checkForUpdate(force=false) {
    if (!registration || !navigator.onLine) return;
    const now = Date.now();
    if (!force && now - lastCheck < 60_000) return;
    lastCheck = now;
    await registration.update();
    if (registration.waiting && navigator.serviceWorker.controller) showAvailable();
  }
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing || !applyingUpdate) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    elements();
    try {
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      observe(reg);
      await checkForUpdate();
    } catch (err) { console.warn('Modo offline o actualizaciones no disponibles:', err); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkForUpdate().catch(() => {});
  });
  window.addEventListener('online', () => checkForUpdate().catch(() => {}));
  // Si la app queda abierta, vuelve a comprobar de vez en cuando.
  window.setInterval(() => {
    if (document.visibilityState === 'visible') checkForUpdate().catch(() => {});
  }, 60 * 60 * 1000);
})();
</script>
