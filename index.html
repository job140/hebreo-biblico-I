/* ===== Rediseño v14: sistema visual ===== */

/* Ruta guiada: componentes didácticos y ejercicios */

/* Cabecera global */
.v3-topbar{position:sticky;top:0;z-index:24;display:flex;gap:14px;align-items:center;justify-content:space-between;

.v3-breadcrumb{display:block;text-transform:uppercase;letter-spacing:.115em;color:var(--v3-teal);font-size:.64rem;font-weight:800;margin-bottom:1px}

.v3-searchbtn{height:41px;padding:0 13px;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;color:var(--mute);background:var(--card);cursor:pointer;min-width:178px;font-size:.83rem}
.v3-searchbtn kbd{margin-left:auto;border-radius:5px;background:var(--v3-soft);border:1px solid var(--line);padding:1px 5px;font-size:.68rem}
.v3-inline-icon{display:inline-grid;vertical-align:middle;place-items:center;line-height:1}
.v3-module-strip{display:flex;gap:13px;align-items:center;justify-content:space-between;margin-bottom:17px;

.v3-module-copy{min-width:0;display:flex;align-items:center;gap:10px}
.v3-module-ic{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--v3-teal-soft);color:var(--v3-teal);font-size:1.3rem}

.v3-module-actions{display:flex;gap:7px;align-items:center}
.v3-plainbtn{background:var(--v3-soft);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:8px 11px;cursor:pointer;font-weight:700;font-size:.75rem;white-space:nowrap}

/* Dashboard */
.v3-home{--home-space:26px;min-width:0}

  gap:20px;padding:clamp(24px,3.4vw,44px);background:radial-gradient(circle at 90% 5%,rgba(112,220,255,.2),transparent 36%),linear-gradient(130deg,#053e4c,#056875 48%,#17658f 100%);color:#fff;box-shadow:0 25px 56px -28px rgba(8,75,101,.45)}

.v3-cta.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}

.v3-goal{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;

  backdrop-filter:blur(8px)}
.v3-goal-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#d9fbf7}
.v3-goal-core{display:flex;align-items:center;gap:16px;margin:12px 0}

  background:conic-gradient(#90f3db var(--pct),rgba(255,255,255,.16) var(--pct));position:relative}

.v3-overline{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:28px 0 15px}
.v3-overline h2,.v3-overline h3{font-size:clamp(1.08rem,1.8vw,1.33rem)!important;margin:0!important;font-weight:800;line-height:1.35;color:var(--ink)}
.v3-overline h2::before{display:none!important}

.v3-kicker{font-size:.73rem;color:var(--v3-teal);font-weight:800}
.v3-quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.v3-quick{position:relative;text-align:left;display:flex;align-items:center;gap:13px;min-width:0;border:1px solid var(--line);border-radius:19px;

.v3-quick-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;flex:0 0 52px;font-size:1.7rem;background:var(--v3-teal-soft)}
.v3-quick[data-tone="violet"] .v3-quick-icon{background:var(--v3-violet-soft)}
.v3-quick[data-tone="orange"] .v3-quick-icon{background:var(--v3-orange-soft)}
.v3-quick b{display:block;font-size:.87rem;line-height:1.35}.v3-quick small{display:block;margin-top:4px;font-size:.72rem;line-height:1.5;color:var(--mute)}
.v3-quick-arrow{margin-left:auto;flex:0 0 15px;color:var(--v3-teal);font-weight:900}
.v3-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.v3-stat{padding:20px 19px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:19px;box-shadow:var(--sh1)}
.v3-stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

.v3-stat b{display:block;font-size:clamp(1.3rem,2.2vw,1.75rem);font-weight:800;letter-spacing:-.045em;line-height:1.2;color:var(--ink)}
.v3-stat small{display:block;color:var(--mute);font-size:.73rem;margin-top:6px;line-height:1.45}
.v3-stat-track{height:5px;background:var(--sel);border-radius:100px;overflow:hidden;margin-top:12px}
.v3-stat-track i{display:block;width:var(--width);height:100%;background:linear-gradient(90deg,#0bb89f,#488de5);border-radius:100px}

.v3-word-card,.v3-plan-card{border:1px solid var(--line);border-radius:22px;padding:23px;background:var(--card);box-shadow:var(--sh1)}
.v3-word-card{display:flex;align-items:center;justify-content:space-between;gap:16px}
.v3-word-label{color:var(--v3-teal);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em}

.v3-sound{width:45px;height:45px;flex:0 0 45px;border:1px solid var(--line);border-radius:14px;background:var(--v3-teal-soft);color:var(--v3-teal);font-size:1.3rem;cursor:pointer}

.v3-library{padding-bottom:30px}
.v3-library-header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin:28px 0 18px}

.v3-library-header h2::before{display:none!important}
.v3-library-header p{margin:0;color:var(--mute);font-size:.82rem}
.v3-filter{display:flex;align-items:center;gap:10px;min-width:min(100%,310px);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 12px;color:var(--mute)}
.v3-filter input{width:100%;height:44px;border:0!important;outline:0!important;color:var(--ink)!important;background:transparent!important;font-size:.8rem;min-width:0}
.v3-section-title{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.91rem;margin:23px 0 11px}

.v3-tile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.v3-tile{min-width:0;position:relative;border-radius:20px;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);padding:18px 16px 15px;display:flex;flex-direction:column;align-items:flex-start;
  gap:7px;cursor:pointer;box-shadow:var(--sh1);transition:border-color .15s,transform .15s,box-shadow .15s}

.v3-tile-icon{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:var(--v3-teal-soft);color:var(--v3-teal);font-size:1.5rem;margin-bottom:7px}
.v3-tile[data-tone="violet"] .v3-tile-icon{background:var(--v3-violet-soft);color:var(--v3-violet)}
.v3-tile[data-tone="orange"] .v3-tile-icon{background:var(--v3-orange-soft);color:var(--v3-orange)}
.v3-tile[data-tone="blue"] .v3-tile-icon{background:var(--v3-blue-soft);color:var(--v3-blue)}

.v3-tile b{font-size:.86rem;line-height:1.4}.v3-tile small{font-size:.71rem;color:var(--mute);line-height:1.5;flex:1}

.v3-modal{width:min(100%,690px);max-height:min(76vh,780px);overflow:hidden;display:flex;flex-direction:column;border-radius:24px;background:var(--card);box-shadow:0 24px 80px -25px #001724;border:1px solid var(--line);color:var(--ink)}

.v3-search-result b{display:block;font-size:.84rem}.v3-search-result small{display:block;font-size:.71rem;line-height:1.4;color:var(--mute);margin-top:2px}

 .v3-module-strip{padding:10px 11px;margin-bottom:12px}
 .v3-module-copy p{display:none}
 .v3-module-ic{width:34px;height:34px;flex-basis:34px;font-size:1.1rem}
 .v3-module-actions .v3-plainbtn:nth-child(2){display:none}
 .v3-home{--home-space:20px}
 .v3-welcome{grid-template-columns:1fr;gap:14px;padding:25px 23px;border-radius:24px}
 .v3-welcome h2{font-size:clamp(1.7rem,7vw,2.25rem)!important}
 .v3-welcome p{font-size:.84rem;margin-bottom:20px}
 .v3-goal{display:none}
 .v3-cta{min-height:42px;padding:11px 13px;font-size:.77rem}
 .v3-overline{margin:23px 2px 12px}
 .v3-quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .v3-quick{padding:14px;gap:11px;border-radius:17px}
 .v3-quick-icon{width:39px;height:39px;flex-basis:39px;font-size:1.34rem;border-radius:12px}
 .v3-quick b{font-size:.77rem}.v3-quick small{font-size:.66rem}.v3-quick-arrow{display:none}
 .v3-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .v3-stat{padding:15px;border-radius:17px}.v3-stat b{font-size:1.35rem}
 .v3-feature-row{grid-template-columns:1fr}
 .v3-word-card,.v3-plan-card{padding:18px;border-radius:18px}
 .v3-library-header{margin:26px 2px 15px}.v3-filter{width:100%;min-width:0}
 .v3-tile-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .v3-tile{padding:15px 13px 13px;border-radius:17px}
 .v3-tile-icon{height:42px;width:42px;font-size:1.34rem;border-radius:13px;margin-bottom:3px}
 .v3-tile b{font-size:.78rem}.v3-tile small{font-size:.68rem}.v3-tile-link{font-size:.68rem}
 #tabs{position:fixed;z-index:30;bottom:calc(9px + env(safe-area-inset-bottom,0px));top:auto;left:9px;right:9px;width:auto;max-width:none;
   height:70px;display:flex;align-items:stretch;justify-content:space-around;flex-wrap:nowrap;gap:2px;overflow:visible;
   padding:7px 5px;margin:0;border-radius:20px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 94%,transparent);
   box-shadow:0 14px 37px -14px rgba(6,55,73,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
 #tabs .nav-group,#tabs .v3-nav-brand,#tabs .v3-nav-search,#tabs .v3-nav-footer{display:none!important}
 #tabs>button[data-k]{display:none}
 #tabs>button.v3-dock-primary,#tabs>.v3-dock-more{display:flex;align-items:center;justify-content:center;flex-direction:column;flex:1 1 0;min-width:0;
   border:0;border-radius:14px;padding:4px 0 3px;gap:3px;background:transparent;color:var(--mute);font-size:.61rem;white-space:nowrap;font-weight:700;box-shadow:none}
 #tabs>button.v3-dock-primary[aria-selected="true"]{background:linear-gradient(140deg,#007c83,#167ca8);color:#fff;box-shadow:0 8px 17px -9px #006f83}
 #tabs button .ti{font-size:1.27rem;height:23px;min-height:23px;line-height:1;display:grid;place-items:center}
 #tabs .v3-mobile-label{display:block;font-size:.6rem;line-height:1.25}
 #tabs>button.v3-dock-primary>span:not(.ti):not(.v3-mobile-label){display:none}
 #tabs>.v3-dock-more .ti{font-size:1.24rem}
 #tabs>.v3-dock-more[aria-expanded="true"]{background:var(--sel);color:var(--blue)}
 #view .route-hero,#view .an-hero,#view .su-hero{padding:21px!important;border-radius:21px!important}
 #view .route-hero h2,#view .an-hero h2,#view .su-hero h2{font-size:1.32rem}
 #view .panel{padding:16px;border-radius:19px}
 #view .su-shell{min-width:0}.su-wrap{max-width:100%}
 .v3-modal-footer{font-size:.63rem}
}
@media(max-width:350px){
 .v3-tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .v3-quick-grid{grid-template-columns:1fr}
 #tabs .v3-mobile-label{font-size:.54rem}
 .v3-iconbtn{width:34px;height:36px}
 .v3-ctx-title{font-size:.78rem}
}
/* Concentración: ocultar navegación lateral/barras sin eliminar contenido */
:root[data-focus="on"] #tabs{opacity:.18;pointer-events:none}
:root[data-focus="on"] #tabs:hover{opacity:1;pointer-events:auto}
:root[data-focus="on"] .v3-module-strip{display:none}
:root[data-focus="on"] .v3-topbar{background:transparent;backdrop-filter:none}
@media(min-width:768px){:root[data-focus="on"] main{max-width:1100px;padding-left:25px;padding-right:25px}}
@media(max-width:767px){:root[data-focus="on"] main{padding-bottom:36px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.v3-quick,.v3-tile,.v3-iconbtn,.v3-cta{transition:none!important}}


/* Ajuste final de la composición del inicio y los pictogramas */
#tabs button.v3-dock-primary .ti .v3-inline-icon svg{width:21px;height:21px}
@media(max-width:767px){
 .v3-quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .v3-quick-grid>.v3-quick:first-child{grid-column:1/-1;min-height:76px}
 .v3-quick-grid>.v3-quick:first-child .v3-quick-icon{width:48px;height:48px;flex-basis:48px}
 .v3-quick-grid>.v3-quick:first-child b{font-size:.86rem}
 #tabs .v3-dock-primary .ti .v3-inline-icon{display:grid;place-items:center}
}

/* Utilidades de conservación del progreso entre versiones */
.v3-backup{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:20px 0 10px;padding:20px 23px;
 background:linear-gradient(112deg,var(--v3-teal-soft),var(--card));border:1px solid var(--line);border-radius:21px}
.v3-backup h3{margin:0 0 5px;font-size:.96rem;color:var(--ink)}
.v3-backup p{margin:0;color:var(--mute);font-size:.77rem;line-height:1.6;max-width:620px}
.v3-backup-actions{display:flex;gap:9px;flex-wrap:wrap}
.v3-backup-actions button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:.76rem;font-weight:800;cursor:pointer}
.v3-backup-actions button:first-child{background:#067983;border-color:#067983;color:white}
@media(max-width:767px){.v3-backup{flex-direction:column;align-items:stretch;padding:17px}.v3-backup-actions button{flex:1}}

/* Gramática pronominal · v3.1: interfaz accesible y autónoma */
.gs-app{--gs-accent:#097c7f;--gs-accent-soft:#dcf6ee;--gs-ink:var(--ink);--gs-line:var(--line);font-family:inherit;max-width:1150px;margin:0 auto 35px;letter-spacing:normal}
.gs-app button{font:inherit;cursor:pointer;transition:background .15s,transform .15s,border-color .15s}
.gs-app button:focus-visible,.gs-app a:focus-visible{outline:3px solid #eaac43;outline-offset:3px}
.gs-app button:disabled{cursor:not-allowed;opacity:.52}
.gs-he,.gs-inline-he{font-family:"Noto Serif Hebrew",serif;unicode-bidi:isolate;direction:rtl;line-height:1.75}
.gs-inline-he{font-size:1.16em;font-weight:700;color:var(--blue)}
.gs-intro{border-radius:27px;padding:clamp(18px,3vw,31px);color:#effffb;background:radial-gradient(circle at 95% 5%,rgba(109,239,202,.28),transparent 38%),linear-gradient(130deg,#073a49,#07696c 65%,#116a6e);box-shadow:0 15px 35px rgba(8,72,76,.17)}
.gs-tag{display:inline-block;font-size:.7rem;font-weight:900;letter-spacing:.12em;color:#adf2d7;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:100px}
.gs-intro-row{display:flex;justify-content:space-between;align-items:center;gap:24px}
.gs-intro h2{font-size:clamp(1.6rem,3vw,2.7rem);color:#fff;line-height:1.17;letter-spacing:-.045em;margin:13px 0 9px}
.gs-intro h2 em{font-style:normal;color:#9aefd8}
.gs-intro p{font-size:.92rem;color:#d5f2ef;max-width:690px;margin:0 0 20px}
.gs-intro-art{min-width:175px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:center;transform:rotate(-6deg)}
.gs-intro-art span{font-family:"Noto Serif Hebrew",serif;direction:rtl;text-align:center;font-weight:700;font-size:1.9rem;color:#0b6260;background:#e9fff9;border:1px solid #bbf2e3;border-radius:15px;padding:13px 8px;box-shadow:0 9px 18px #002f3233}
.gs-intro-art span:last-child{grid-column:span 2;background:#ffe8ae;border-color:#fce4a0;color:#684019}
.gs-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gs-unit{display:flex;align-items:center;text-align:left;gap:10px;min-width:0;border:1px solid rgba(255,255,255,.28);border-radius:15px;background:rgba(255,255,255,.09);padding:13px 11px;color:#fff}
.gs-unit.active{background:#f4fffd;color:#083d43;border-color:#dcfef2;box-shadow:0 8px 18px #00333c2e}
.gs-unit.locked{opacity:.7}
.gs-unit-ico{font-size:1.3rem;flex:0 0 35px;background:rgba(255,255,255,.15);height:35px;display:grid;place-items:center;border-radius:11px}
.gs-unit.active .gs-unit-ico{background:#d5f5ee}
.gs-unit-copy{display:flex;flex-direction:column;min-width:0;gap:3px}
.gs-unit-copy b{font-size:.85rem;line-height:1.2}
.gs-unit-copy small{font-size:.7rem;line-height:1.3;color:inherit;opacity:.82}
.gs-current{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 5px 15px}
.gs-current h3{font-size:1.35rem;margin:4px 0 3px;color:var(--ink)}
.gs-current p{margin:0;color:var(--mute);font-size:.85rem;max-width:680px}
.gs-mini-label,.gs-eyebrow{font-size:.68rem;font-weight:900;letter-spacing:.11em;color:var(--blue)}
.gs-master{font-size:1.38rem;color:var(--blue);font-weight:900;white-space:nowrap}
.gs-master small{display:block;text-align:right;color:var(--mute);font-size:.67rem;letter-spacing:0}
.gs-modebar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:5px 0 11px;position:relative}
.gs-modebar button{flex:1 0 auto;white-space:nowrap;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--mute);font-size:.77rem;font-weight:800}
.gs-modebar button.on{color:#fff;background:#087c80;border-color:#087c80;box-shadow:0 6px 16px #087c8030}
.gs-surface{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(17px,3vw,29px);box-shadow:0 10px 25px rgba(4,56,62,.045)}
.gs-surface h3{font-size:1.34rem;margin:4px 0 14px;line-height:1.3;color:var(--ink)}
.gs-surface h4{font-size:1rem;margin:21px 0 10px;color:var(--ink)}
.gs-surface>p{color:var(--mute);font-size:.88rem;line-height:1.75}
.gs-lead{font-size:.98rem!important;font-weight:650;color:var(--ink)!important}
.gs-steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:20px 0}
.gs-step{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px}
.gs-stepn{font-size:1.05rem;flex:0 0 34px;width:34px;height:34px;background:var(--sel);border-radius:10px;color:var(--blue);display:grid;place-items:center;font-weight:900}
.gs-step b{font-size:.86rem;display:block;color:var(--ink)}
.gs-step p{font-size:.79rem;color:var(--mute);margin:5px 0 0;line-height:1.7}
.gs-tips{display:grid;gap:9px}.gs-tip{display:flex;align-items:flex-start;gap:11px;border-left:3px solid #26ae97;background:var(--bg);padding:10px 13px;border-radius:9px}
.gs-tip span{color:#1a9b87}.gs-tip p{margin:0;font-size:.82rem;line-height:1.75;color:var(--ink)}
.gs-inline-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:19px}
.gs-btn{border:1px solid #087a80;background:#087a80;color:#fff;border-radius:11px;padding:11px 16px;font-size:.8rem!important;font-weight:800!important}
.gs-btn:not(:disabled):hover{background:#096c72;transform:translateY(-1px)}
.gs-btn.gs-outline{background:var(--card);color:var(--ink);border-color:var(--line)}
.gs-table-shell{border-radius:18px;border:1px solid var(--line);overflow:hidden;margin:18px 0}
.gs-table-title{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:15px;background:var(--bg)}
.gs-table-title h4{margin:0 0 4px;font-size:.92rem}.gs-table-title p{margin:0;font-size:.75rem;color:var(--mute);line-height:1.5}
.gs-fig{background:var(--sel);color:var(--blue);border-radius:10px;padding:5px 11px;font-size:.73rem;font-weight:800}
.gs-table-scroll{overflow-x:auto}
.gs-table{border-collapse:collapse;width:100%;min-width:470px;text-align:left}
.gs-table th{padding:9px 15px;background:var(--sel);color:var(--ink);font-size:.75rem}
.gs-table td{padding:8px 15px;border-bottom:1px solid var(--line);font-size:.82rem;vertical-align:middle}
.gs-table tr:last-child td{border-bottom:0}.gs-table tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.gs-table td:first-child b{display:block;color:var(--ink)}.gs-table td:first-child small{display:block;color:var(--mute);font-size:.67rem}
.gs-he-btn{color:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;border:0;padding:2px 0;font-size:.75rem}
.gs-he-btn .gs-he{font-size:1.45rem;font-weight:700}
.gs-explorer{border:1px solid var(--line);background:var(--bg);padding:20px;border-radius:17px;text-align:center}
.gs-hero-he{font-size:clamp(2.3rem,6vw,3.6rem);color:var(--blue);font-weight:700;line-height:1.6}
.gs-meaning{color:var(--ink);font-size:.94rem}.gs-parts{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin:23px 0}
.gs-part{display:flex;flex-direction:column;gap:5px;align-items:center;padding:15px 20px;border:1px solid var(--line);background:var(--card);border-radius:15px;min-width:135px}
.gs-part:nth-child(2){border-color:#e8c06e;background:color-mix(in srgb,#fbe7a9 22%,var(--card))}
.gs-part .gs-he{color:var(--blue);font-size:1.65rem;font-weight:700}.gs-part small{font-size:.74rem;color:var(--mute)}
.gs-note{font-size:.78rem;color:var(--mute);margin:0}
.gs-example-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:17px 0 0;font-size:.76rem;color:var(--mute)}
.gs-example-footer>div{display:flex;gap:7px}
.gs-mini-btn{padding:8px 10px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:.76rem!important;font-weight:800!important}
.gs-mini-btn.gs-next{color:#fff;background:#087a80}
.gs-drill-top{display:flex;justify-content:space-between;gap:12px;align-items:start}
.gs-drill-top h3{margin:0}.gs-drill-top p{margin:4px 0 0;color:var(--mute);font-size:.78rem}
.gs-round{display:inline-block;white-space:nowrap;background:var(--sel);color:var(--blue);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.78rem}
.gs-round-track{background:var(--line);height:7px;border-radius:100px;overflow:hidden;margin:16px 0 22px}
.gs-round-track span{display:block;background:#0eab99;height:100%;transition:width .2s}
.gs-prompt{font-size:1.11rem;font-weight:800;color:var(--ink);line-height:1.65;margin-bottom:20px}
.gs-prompt .gs-inline-he{font-size:1.34em}
.gs-answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gs-answer{display:flex;align-items:center;text-align:left;gap:12px;padding:14px 12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--ink);font-size:.83rem!important}
.gs-answer>span:first-child{flex:0 0 28px;width:28px;height:28px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-weight:900;color:var(--blue)}
.gs-answer:hover:not(:disabled){border-color:var(--blue)}.gs-answer.is-correct{background:#e0f8ec;border-color:#29a779;color:#145c3d}.gs-answer.is-incorrect{background:#ffe9e8;border-color:#e97970;color:#903d32}
.gs-input-card{display:grid;gap:9px}.gs-input-card label{font-weight:800;font-size:.83rem}.gs-input-card input{font-family:"Noto Serif Hebrew",serif;font-size:1.6rem;border:1.5px solid var(--line);border-radius:13px;padding:11px;color:var(--ink);background:var(--bg);width:100%}
.gs-input-card small,.gs-builder>small{color:var(--mute);font-size:.76rem}.gs-input-card .gs-btn{justify-self:start}
.gs-builder{display:grid;gap:14px}.gs-built{display:flex;min-height:95px;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px;border:2px dashed var(--line);border-radius:14px;padding:13px;background:var(--bg)}
.gs-built button{border:1px solid #93c5b9;background:var(--card);padding:6px 18px;border-radius:11px}.gs-built .gs-he{font-size:1.55rem}
.gs-placeholder{font-size:.84rem;color:var(--mute)}.gs-builder-pieces{display:flex;flex-wrap:wrap;justify-content:center;gap:11px}
.gs-builder-pieces button{background:var(--sel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 17px;display:grid;gap:4px}
.gs-builder-pieces button .gs-he{font-size:1.52rem}.gs-builder-pieces button small{font-size:.68rem;color:var(--mute)}
.gs-feedback{padding:13px 15px;border-radius:14px;margin-top:18px;border:1px solid #92d0b7;background:#e0f7ed;color:#155d46}
.gs-feedback.is-no{border-color:#e9b18e;background:#fff1e3;color:#833f2d}
.gs-feedback p{font-size:.83rem;margin:5px 0 0;line-height:1.65}.gs-drill-help{margin-top:18px;font-size:.75rem;color:var(--mute)}
.gs-finish{text-align:center}.gs-finish .gs-medal{font-size:3rem}.gs-finish .gs-final-number{font-size:3.5rem;font-weight:900;color:var(--blue)}.gs-finish .gs-inline-actions{justify-content:center}
.gs-verse-switch{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.gs-verse-switch button{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-size:.75rem!important;font-weight:800!important}
.gs-verse-switch button.on{color:#fff;background:#087a80;border-color:#087a80}
.gs-verse{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:18px 16px}
.gs-verse>b{display:block;font-size:.87rem;color:var(--ink)}.gs-verse>small{font-size:.73rem;color:var(--mute)}
.gs-verse-words{font-family:"Noto Serif Hebrew",serif;line-height:2.2;display:flex;flex-wrap:wrap;justify-content:center;gap:5px 7px;margin-top:15px;direction:rtl}
.gs-token{font-family:"Noto Serif Hebrew",serif!important;font-size:clamp(1.25rem,2.5vw,1.6rem)!important;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);padding:3px 6px;line-height:1.7}
.gs-token.has-suffix{background:color-mix(in srgb,#18bca3 16%,var(--card));border-bottom:2px solid #25a58e}
.gs-token.selected{color:#073c3c;background:#ffebaa;border-color:#e3af47;box-shadow:0 2px 12px #bb9f4777}
.gs-verse-answer{background:var(--sel);border-radius:14px;margin-top:14px;padding:17px}
.gs-verse-answer-row{display:flex;justify-content:space-between;align-items:center;gap:13px;margin-top:7px}.gs-verse-answer-row .gs-he{font-size:1.55rem;font-weight:700;color:var(--blue)}
.gs-verse-answer-row span:last-child{font-weight:900;font-size:.86rem}.gs-verse-answer p{font-size:.8rem;color:var(--ink);margin:8px 0 0}
.gs-empty-tip{padding:17px;color:var(--mute);background:var(--bg);border-radius:12px;font-size:.81rem;margin-top:13px}
.gs-legend{display:flex;flex-wrap:wrap;gap:17px;margin:13px 0;font-size:.76rem;color:var(--mute)}
.gs-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line)}.gs-dot.suf{background:#1baf9a}
.gs-source{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 17px;margin-top:14px}
.gs-source summary{color:var(--ink);font-size:.82rem}.gs-source p{font-size:.77rem;color:var(--mute);line-height:1.7}.gs-source a{color:var(--blue)}
.gs-footer-note{text-align:center;color:var(--mute);font-size:.69rem;margin:18px 0}
:root[data-theme="dark"] .gs-answer.is-correct{background:#174d3b;color:#d3ffec;border-color:#48be8c}
:root[data-theme="dark"] .gs-answer.is-incorrect{background:#593031;color:#ffdfdb;border-color:#d17b74}

const miss={};let Q=null,score=0,total=0,streak=0,mode="vex";
function pick(arr,key){const w=arr.map((x,i)=>1+3*(miss[key(x,i)]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i]}return arr[0]}
function newQ0(){
  if(mode==="syl"){
    const c=pick(SYL,x=>"c"+x[0]),v=SV[Math.floor(Math.random()*SV.length)];
    const ans=c[1]+v[1],glyph=c[2]+v[0];
    const set=new Set([ans]);let g=0;
    while(set.size<4&&g++<60){const c2=SYL[Math.floor(Math.random()*SYL.length)],v2=SV[Math.floor(Math.random()*SV.length)];set.add(c2[1]+v2[1])}
    Q={key:"c"+c[0],prompt:`<span class="big he" lang="he">${glyph}</span>`,q:"¿Cómo se lee esta sílaba?",ans,opts:shuffle([...set]),he:false,say:glyph};
  }else{
    const l=pick(L,x=>x[1]);
    const others=shuffle(L.filter(x=>x!==l)).slice(0,3);
    const all=shuffle([l,...others]);
    if(mode==="l2n")Q={key:l[1],prompt:`<span class="big he" lang="he">${l[0]}</span>`,q:"¿Cómo se llama esta letra?",ans:l[1],opts:all.map(x=>x[1]),he:false,say:l[5]};

  }
}
function vPractica(){
  if(!Q)newQ();

  <div class="stats"><span>Aciertos: <b>${score}</b> / ${total}</span><span>Racha: <b>${streak}</b> · mejor ${best}</span></div>
  <label class="note" style="display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0"><input type="checkbox" id="fast" ${fast?"checked":""}> Avance automático (más rápido)</label>
  <div class="panel center">${Q.prompt}<p class="note" style="margin:6px 0 0">${Q.q}</p></div>
  <div class="opts" id="opts">${Q.opts.map(o=>`<button class="opt" data-o="${esc(o)}">${Q.he?`<span class="he" lang="he">${o}</span>`:esc(o)}</button>`).join("")}</div>
  <div class="center"><button class="btn alt" id="hear">🔊 Escuchar</button> <button class="btn hidden" id="next">Siguiente</button></div>
  <p class="note center" id="fb" aria-live="polite"></p>`;
  $("#mode").value=mode;
  $("#mode").onchange=e=>{mode=e.target.value;Q=null;vPractica()};
  $("#hear").onclick=()=>say(Q.say);$("#fast").onchange=e=>{fast=e.target.checked;try{localStorage.setItem("hb_fast",fast?"1":"0")}catch(x){}};
  let done=false;
  activeView().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;total++;
    const ok=b.dataset.o===Q.ans;
    if(ok){score++;streak++;best=Math.max(best,streak);sv();b.classList.add("ok");miss[Q.key]=Math.max(0,(miss[Q.key]||0)-1);$("#fb").textContent="¡Correcto! "+(Q.why||"")}

    say(Q.say);$("#next").classList.remove("hidden");$("#next").focus();if(fast){const qq=Q;setTimeout(()=>{if(Q===qq&&document.querySelector("#next")){newQ();vPractica()}},ok?900:2400)}
  });

  const l=L[selT];

  <p class="note">Traza con el dedo o el mouse. Quita la guía para escribirla de memoria y vuélvela a activar para comparar. Se escribe de derecha a izquierda; cada letra, de arriba hacia abajo.</p></div>`;
  const cv=$("#cv"),ctx=cv.getContext("2d");let dr=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  ctx.lineWidth=10;ctx.lineCap="round";ctx.lineJoin="round";
  cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);ctx.strokeStyle=getComputedStyle(document.body).color;ctx.beginPath();const[x,y]=pos(e);ctx.moveTo(x,y);ctx.lineTo(x+.1,y);ctx.stroke()};
  cv.onpointermove=e=>{if(!dr)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{dr=false};
  $("#cl").onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
  $("#gd").onclick=e=>{const g=$("#guide");const on=g.style.visibility!=="hidden";g.style.visibility=on?"hidden":"visible";e.target.textContent="Guía: "+(on?"no":"sí")};
  $("#hw").onclick=e=>{hand=!hand;$("#guide").classList.toggle("hw",hand);e.target.textContent=hand?"Imprenta":"Manuscrita"};

  $("#nx").onclick=()=>{selT=(selT+1)%L.length;vTrazo()};

}

// ---- Transliteración ----
const TR={"א":"ʼ","ב":"v","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ḥ","ט":"ṭ","י":"y","כ":"kh","ך":"kh","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"ʻ","פ":"f","ף":"f","צ":"ts","ץ":"ts","ק":"q","ר":"r","ש":"sh","ת":"t"};
const DG={"ב":"b","כ":"k","ך":"k","פ":"p","ף":"p","ג":"g","ד":"d","ת":"t"};
const VM={"\u05B7":"a","\u05B8":"a","\u05B5":"e","\u05B6":"e","\u05B4":"i","\u05B9":"o","\u05BB":"u","\u05B0":"ə","\u05B1":"e","\u05B2":"a","\u05B3":"o"};
function translit0(s){
  const M=/[\u0591-\u05C7]/;const cs=[...s];let o="",lv="";
  for(let i=0;i<cs.length;i++){
    const c=cs[i];
    if(!TR[c]){if(!M.test(c)){o+=c;lv=""}continue}
    let m="",j=i+1;while(j<cs.length&&M.test(cs[j]))m+=cs[j++];
    const end=!(j<cs.length&&TR[cs[j]]);i=j-1;
    const dg=m.includes("\u05BC");let v="";for(const x of m)if(VM[x])v=VM[x];
    let t=TR[c];if(dg&&DG[c])t=DG[c];
    if(c==="ש")t=m.includes("\u05C2")?"s":"sh";
    if(c==="ו"&&m.includes("\u05B9")){o+="o";lv="o";continue}
    if(c==="ו"&&dg&&!v){o+="u";lv="u";continue}
    if(c==="י"&&!v&&lv==="i")continue;
    if(v==="ə"&&end)v="";
    o+=t+v;lv=v;
  }
  return o;
}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"").replace(/kh|ch/g,"j").replace(/ph/g,"f").replace(/q/g,"k").replace(/tz/g,"ts").replace(/h$/,"");
const cons=s=>[...s].filter(c=>TR[c]).map(c=>FIN[c]||c).join("");
const rnd=()=>Math.floor(Math.random()*W.length);
function vTrans(){

const VX={"\u05B0":"ə","\u05B1":"ĕ","\u05B2":"ă","\u05B3":"ŏ","\u05B4":"i","\u05B5":"ē","\u05B6":"e","\u05B7":"a","\u05B8":"ā","\u05BB":"u","\u05C7":"o"};
const TX={"א":"ʼ","ב":"v","ג":"g","ד":"d","ה":"h","ו":"v","ז":"z","ח":"ḥ","ט":"ṭ","י":"y","כ":"kh","ך":"kh","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"ʻ","פ":"f","ף":"f","צ":"ts","ץ":"ts","ק":"q","ר":"r","ש":"sh","ת":"t"};
const HX={"ב":"b","כ":"k","ך":"k","פ":"p","ף":"p","ג":"g","ד":"d","ת":"t"};
const LONGV=["ā","ē","ō","î","ê","ô","û","â"];
function twd(w,mq){
  const U=[];let c=null;
  for(const ch of w){
    if(ch>="\u05D0"&&ch<="\u05EA"){c={c:ch,dg:0,sn:"",v:"",hol:0,vow:"",skip:0};U.push(c)}
    else if(c){if(ch==="\u05BC")c.dg=1;else if(ch==="\u05C1"||ch==="\u05C2")c.sn=ch;else if(ch==="\u05B9"||ch==="\u05BA")c.hol=1;else if(VX[ch])c.v=ch}
  }
  const cs=U.map(u=>u.c).join("");
  if(cs==="יהוה")return"YHWH";
  if(cs==="ליהוה")return"la-YHWH";
  const n=U.length;
  U.forEach((u,i)=>{const p=U[i-1];
    if(u.c==="ו"&&!u.v&&!u.hol&&u.dg){if(i===0)u.vow="û",u.cons="";else if(p&&!p.v&&!p.hol){p.vow="û";u.skip=1}}
    else if(u.c==="ו"&&u.hol&&!u.v&&p&&!p.v&&!p.hol){p.vow="ô";u.skip=1}
    else if(u.c==="י"&&!u.v&&!u.hol&&!u.dg&&p&&!p.hol){if(p.v==="\u05B4"){p.vow="î";u.skip=1}else if(p.v==="\u05B5"||p.v==="\u05B6"){p.vow="ê";u.skip=1}}
    else if(u.c==="ה"&&i===n-1&&!u.v&&!u.hol&&!u.dg&&p){if(p.v==="\u05B8"){p.vow="â";u.skip=1}else if(p.v==="\u05B6"||p.v==="\u05B5"){p.vow="ê";u.skip=1}else if(p.hol){p.vow="ô";u.skip=1}}
  });
  const hasV=u=>u&&(u.skip||u.vow||u.hol||(u.v&&u.v!=="\u05B0"));
  const forte=(u,i)=>u.dg&&i>0&&hasV(U[i-1]);
  let out="";
  U.forEach((u,i)=>{
    if(u.skip)return;
    const p=U[i-1],nx=U[i+1],last=i===n-1,f=forte(u,i);
    let v=u.vow;
    if(!v){
      if(u.hol)v="ō";
      else if(u.v==="\u05B0"){
        const pv=p&&(p.skip?"ô":p.vow||(p.hol?"ō":VX[p.v]||""));
        if(i===0)v="ə";
        else if(last)v="";
        else if(u.dg&&f)v="ə";
        else if(nx&&nx.v==="\u05B0")v="";
        else if(p&&p.v==="\u05B0"&&p.vow==="")v="ə";
        else if(LONGV.includes(pv))v="ə";
        else v="";
        u.vow=v;
      }else{
        v=VX[u.v]||"";
        if(u.v==="\u05B8"&&i===n-2&&nx&&!nx.v&&!nx.hol&&!nx.skip&&(mq||(u.c==="כ"&&nx.c==="ל")))v="o";
      }
    }
    let t;
    if(u.c==="ש")t=u.sn==="\u05C2"?"s":"sh";
    else if(HX[u.c])t=u.dg?HX[u.c]:(u.c==="ג"||u.c==="ד"||u.c==="ת"?HX[u.c]:TX[u.c]);
    else t=TX[u.c];
    if(kel){if(u.c==="ו")t="w";else if(u.c==="צ"||u.c==="ץ")t="ṣ";else if(u.c==="ש")t=u.sn==="\u05C2"?"ś":"š"}
    if(u.dg&&f&&!"אהחער".includes(u.c))t=t+t;
    if(u.c==="א"&&!u.v&&!u.hol&&i===0)t="ʼ";
    if(last&&"חעה".includes(u.c)&&u.v==="\u05B7"&&p&&(LONGV.includes(p.vow)||p.hol||p.skip))out+="a"+t;
    else out+=(u.cons===""?"":t)+v;
  });
  return out;
}

}

function vunits(w){const U=[];let u=null;for(const ch of w){if(ch>="\u05D0"&&ch<="\u05EA"){u={c:ch,s:ch,v:"",hol:0,dg:0};U.push(u)}else if(u){u.s+=ch;if(ch==="\u05BC")u.dg=1;else if(ch==="\u05B9"||ch==="\u05BA")u.hol=1;else if(VNAME[ch])u.v=ch}}return U}

function shewaInfo(U,i){
  const u=U[i],n=U.length,p=U[i-1];
  if(u.v!=="\u05B0"||isM(U,i))return null;
  const hasV=x=>x&&(x.hol||(x.v&&x.v!=="\u05B0"));
  if(i===0)return["Vocálica","Está bajo la primera letra de la palabra."];
  if(U[i+1]&&U[i+1].v==="\u05B0")return["Muda","Es la primera de dos shewas seguidos."];
  if(p&&p.v==="\u05B0")return["Vocálica","Es la segunda de dos shewas seguidos."];
  if(u.dg&&(hasV(p)||isM(U,i-1)))return["Vocálica","La letra lleva dagesh forte."];
  if(i===n-1)return["Muda","Está en la última letra."];
  if(isM(U,i-1)||p.hol)return["Vocálica","La vocal anterior es larga (criterio clásico)."];
  if(["\u05B4","\u05B6","\u05B7","\u05BB"].includes(p.v))return["Muda","La vocal anterior es breve: el shewa cierra la sílaba."];
  if(p.v==="\u05B5")return["Vocálica","La vocal anterior (seré) es larga."];
  return null;
}

const LAB_MODES=[['identificar','Identificar'],['escribir','Escribir'],['traducir','Traducir'],['construir','Construir'],['errores','Detectar errores'],['examen','Simulacro']];
let lab={mode:'identificar',idx:0,selected:null,correct:0,total:0,wrong:[],exam:[],examAnswers:{},showExam:false};
try{const saved=JSON.parse(localStorage.getItem(LAB_KEY)||'null');if(saved&&typeof saved==='object')lab={...lab,...saved,selected:null}}catch(e){}
function labSave(){try{localStorage.setItem(LAB_KEY,JSON.stringify(lab))}catch(e){}}
function labNorm(v){return String(v||'').normalize('NFD').replace(/[\u0591-\u05bd\u05bf-\u05c7]/g,'').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase().trim()}
function labSetMode(m){lab.mode=m;lab.idx=0;lab.selected=null;lab.showExam=false;lab.examAnswers={};if(m==='examen'){const ids=LAB_BANK.map((q,i)=>i).filter(i=>LAB_BANK[i][0]!=='escribir');lab.exam=ids.sort(()=>Math.random()-.5).slice(0,20)}labSave();vLab()}
function vLab(){const root=document.querySelector('.view-panel[data-view="lab"]');if(!root)return;const mode=lab.mode,qs=LAB_BANK.filter(q=>q[0]===mode),q=qs[lab.idx%qs.length],isExam=mode==='examen';

root.querySelectorAll('[data-lab-mode]').forEach(b=>b.onclick=()=>labSetMode(b.dataset.labMode));const w=root.querySelector('#lab-work');

w.innerHTML=`<h3>Simulacro final</h3><p>Responde las 20 preguntas. Aquí las respuestas se muestran al finalizar para simular un examen real.</p>${lab.exam.map((id,i)=>{const x=LAB_BANK[id];return `<fieldset class="lab-field"><legend>${i+1}. ${esc(x[1])}</legend>${x[2].map((o,j)=>`<label class="lab-choice"><input type="radio" name="exam-${i}" value="${j}" ${+lab.examAnswers[i]===j?'checked':''}> ${esc(o)}</label>`).join('')}</fieldset>`}).join('')}<button class="btn primary" id="lab-finish" ${Object.keys(lab.examAnswers).length<20?'disabled':''}>Calificar simulacro (${Object.keys(lab.examAnswers).length}/20)</button>`;w.querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{lab.examAnswers[el.name.split('-')[1]]=el.value;labSave();w.querySelector('#lab-finish').disabled=Object.keys(lab.examAnswers).length<20;w.querySelector('#lab-finish').textContent=`Calificar simulacro (${Object.keys(lab.examAnswers).length}/20)`});w.querySelector('#lab-finish').onclick=()=>{lab.showExam=true;labSave();vLab()};return;}
const answered=lab.selected!==null;w.innerHTML=`<p class="route-muted">Ejercicio ${lab.idx%qs.length+1} de ${qs.length} · Aciertos acumulados: ${lab.correct}/${lab.total}</p><div class="route-progress"><span style="width:${(lab.idx%qs.length)/qs.length*100}%"></span></div><h3>${esc(q[1])}</h3>${mode==='escribir'?`<form id="lab-answer-form"><input id="lab-answer" class="lab-input" dir="auto" autocomplete="off" placeholder="Escribe tu respuesta" ${answered?'disabled':''} required><button class="btn primary" ${answered?'disabled':''}>Comprobar</button></form>`:`<div class="route-options">${q[2].map((opt,i)=>`<button class="route-option ${answered?(i===q[3]?'good':i===lab.selected?'bad':''):''}" data-lab-answer="${i}" ${answered?'disabled':''}>${'ABCD'[i]}. ${esc(opt)}</button>`).join('')}</div>`}${answered?`<div class="route-feedback"><b>${lab.selected===true||lab.selected===q[3]?'¡Muy bien!':'Revisa tu respuesta'}</b><p>${esc(q[mode==='escribir'?3:4])}</p>${mode==='escribir'?`<p>Respuesta esperada: <b dir="auto">${esc(q[2])}</b></p>`:''}</div><button class="btn primary" id="lab-next">Siguiente ejercicio →</button>`:'<p class="route-muted">Responde para obtener una explicación inmediata.</p>'}`;
function record(ok,selection){lab.selected=mode==='escribir'?ok:selection;lab.total++;if(ok)lab.correct++;else lab.wrong.push({mode,question:q[1]});labSave();vLab()}

}

function initNavigation(){
 const nav=document.getElementById("tabs");
 nav.innerHTML=TABS.map(([key,name])=>`<button type="button" role="tab" id="tab-${key}" aria-controls="panel-${key}" aria-selected="${key===tab}" tabindex="${key===tab?0:-1}" data-k="${key}"><span class="ti he" aria-hidden="true">${TI[key]}</span><span>${name}</span></button>`).join("");
 const host=document.getElementById("view");
 host.innerHTML=TABS.map(([key])=>`<div class="view-panel" id="panel-${key}" data-view="${key}" role="tabpanel" aria-labelledby="tab-${key}" ${key===tab?"":"hidden"}></div>`).join("");
 nav.addEventListener("click",e=>{const btn=e.target.closest("button[data-k]");if(btn)navigate(btn.dataset.k)});
 nav.addEventListener("keydown",e=>{if(!["ArrowRight","ArrowLeft","ArrowUp","ArrowDown","Home","End"].includes(e.key))return;const buttons=[...nav.querySelectorAll("button[data-k]")];const i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const next=e.key==="Home"?0:e.key==="End"?buttons.length-1:(i+(e.key==="ArrowRight"||e.key==="ArrowDown"?1:-1)+buttons.length)%buttons.length;buttons[next].focus();navigate(buttons[next].dataset.k)});
 navigate(tab);
}
const tabScroll=new Map();
function navigate(key){
 if(!TABS.some(([k])=>k===key))return;
 const current=activeView();if(current&&!current.hidden)tabScroll.set(tab,window.scrollY);
 tab=key;
 document.querySelectorAll(".view-panel").forEach(el=>{el.hidden=el.dataset.view!==tab});
 document.querySelectorAll("#tabs button").forEach(btn=>{const on=btn.dataset.k===tab;btn.setAttribute("aria-selected",String(on));btn.tabIndex=on?0:-1});
 document.querySelector(".hero")?.classList.toggle("compact",tab!=="inicio");
 render(true);
 const selected=document.querySelector(`#tabs button[data-k="${tab}"]`);
 if(window.innerWidth<768&&selected)selected.scrollIntoView({block:"nearest",inline:"nearest"});
 window.scrollTo({top:tabScroll.get(tab)||0,behavior:"instant"});
}

 {title:'Sustantivos y posesión',pages:'24–28',theory:'En un sustantivo, el sufijo expresa posesión. La base adopta una forma constructa y la expresión queda determinada sin tomar artículo delante del sustantivo.',rule:'קוֹל = voz · קוֹלִי = mi voz · קוֹלוֹ = su voz (de él) · אֱלֹהַי = mi Dios · אֱלֹהָיו = su Dios.',example:'קוֹלִי  ·  קוֹלוֹ  ·  אֱלֹהַי',meaning:'Mi voz · su voz (de él) · mi Dios',items:[['¿Qué significa קוֹלִי?',['Mi voz','Nuestras voces','Tu voz'],0,'קוֹל con sufijo de 1cs.'],['¿Qué significa קוֹלוֹ?',['Su voz (de él)','Mi voz','La voz de ellas'],0,'Sufijo de 3ms.'],['¿Qué significa אֱלֹהַי?',['Mi Dios','Sus dioses','Tu Dios'],0,'Ejemplo del paradigma de sustantivos plurales con sufijos.'],['¿El sustantivo con sufijo posesivo toma הַ delante?',['No','Siempre','Solo en plural'],0,'El sustantivo con sufijo ya es definido.'],['Un adjetivo atributivo que sigue al sustantivo con sufijo…',['lleva artículo','nunca concuerda','se vuelve verbo'],0,'La forma posesiva es definida; el adjetivo atributivo también debe serlo.']]},
 {title:'Analiza Génesis 12:1',pages:'29–31, 35',theory:'Separa cada forma en prefijo + base + sufijo. Ejemplo: מֵאַרְצְךָ = מִן (de) + אֶרֶץ (tierra) + ךָ (tu, 2ms). Observa también las cadenas constructas.',rule:'מֵאַרְצְךָ = de tu tierra · וּמִבֵּית = y de casa de · אָבִיךָ = tu padre · אֶל־הָאָרֶץ = a la tierra.',example:'לֶךְ־לְךָ מֵאַרְצְךָ',meaning:'Vete de tu tierra · Génesis 12:1 (fragmento)',items:[['En מֵאַרְצְךָ, ¿qué expresa ךָ?',['Tu (2ms)','Mi (1cs)','Nuestro (1cp)'],0,'Sufijo pronominal de 2ms.'],['¿Qué significa מֵאַרְצְךָ?',['De tu tierra','A la tierra','En su casa'],0,'Preposición מִן + sustantivo אֶרֶץ + 2ms.'],['En וּמִבֵּית, ¿qué marca וּ?',['Conjunción «y»','Artículo','Sufijo femenino'],0,'וּ es variante de la conjunción waw.'],['¿Qué expresa הָ en הָאָרֶץ?',['Artículo definido','Sufijo 3fs','Preposición «desde»'],0,'Artículo definido ante אֶרֶץ.'],['¿Qué es בֵּית en «casa de tu padre»?',['Sustantivo constructo','Pronombre','Adverbio'],0,'בֵּית es forma constructa de בַּיִת.']]},

function gsStore(){try{localStorage.setItem(GS_KEY,JSON.stringify({unit:gs.unit,best:gs.best,verse:gs.verse,exp:gs.exp}))}catch(e){}}
function gsHeb(t,cl=''){return `<bdi dir="rtl" lang="he" class="gs-he ${cl}">${esc(t)}</bdi>`}
function gsNorm(t){return String(t).normalize('NFKD').replace(/[\u0591-\u05C7\u0300-\u036f]/g,'').replace(/[־\s'".,!?¡¿]/g,'').toLowerCase().trim()}
function gsCanGo(i){return i===0||(gs.best[i-1]||0)>=80}
function gsSelectUnit(i){if(!gsCanGo(i))return;gs.unit=i;gs.mode='teoria';gs.exp=0;gs.q=0;gs.answered=false;gs.pieces=[];gs.results=[];gsStore();vGSuf()}
function gsSelectMode(k){gs.mode=k;gs.answered=false;gs.value=null;gs.pieces=[];gs.token=-1;if(k==='entrenar'){gs.q=0;gs.results=[]}gsStore();vGSuf()}
function gsTheory(u){return `<div class="gs-surface"><div class="gs-eyebrow">01 · BASE GRAMATICAL</div><h3>Comprende antes de memorizar</h3><p class="gs-lead">${esc(u.intro)}</p><div class="gs-steps">${u.steps.map(s=>`<div class="gs-step"><span class="gs-stepn">${s[0]}</span><div><b>${s[1]}</b><p>${gsFmt(s[2])}</p></div></div>`).join('')}</div><h4>Reglas que debes recordar</h4><div class="gs-tips">${u.tips.map(t=>`<div class="gs-tip"><span aria-hidden="true">✦</span><p>${gsFmt(t)}</p></div>`).join('')}</div><div class="gs-inline-actions"><button class="gs-btn" data-gs="mode" data-mode="tablas">Ver formas y terminaciones →</button><button class="gs-btn gs-outline" data-gs="mode" data-mode="versiculos">Analizar versículos</button></div></div>`}
function gsFmt(t){return esc(t).replace(/[\u0590-\u05FF][\u0590-\u05FF־]*/g,x=>`<bdi dir="rtl" lang="he" class="gs-inline-he">${x}</bdi>`)}
function gsTables(u){return `<div class="gs-surface"><div class="gs-eyebrow">02 · PARADIGMAS COMPLETOS</div><h3>Memoriza por persona y número</h3><p>En la columna izquierda identificas al poseedor o referente. Toca cualquier forma hebrea para escucharla si tu navegador dispone de voz hebrea.</p>${u.tables.map((t,j)=>`<section class="gs-table-shell"><div class="gs-table-title"><div><h4>${t.title}</h4><p>${t.help}</p></div><span class="gs-fig">${j+1}/${u.tables.length}</span></div><div class="gs-table-scroll"><table class="gs-table"><thead><tr><th>Persona</th><th>Forma hebrea</th><th>Traducción</th></tr></thead><tbody>${t.rows.map((r,i)=>`<tr><td><b>${GS_PERSONS[i]?.[0]||'—'}</b><small>${GS_PERSONS[i]?.[1]||''}</small></td><td><button class="gs-he-btn" data-gs="say" data-say="${esc(r[0])}" aria-label="Escuchar ${esc(r[0])}">${gsHeb(r[0])} <span>◖))</span></button></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}<div class="gs-inline-actions"><button class="gs-btn" data-gs="mode" data-mode="desarmar">Analizar palabras →</button><button class="gs-btn gs-outline" data-gs="mode" data-mode="entrenar">Ir a las prácticas</button></div></div>`}
function gsExplore(u){const e=u.explore[Math.min(gs.exp,u.explore.length-1)];return `<div class="gs-surface"><div class="gs-eyebrow">03 · LABORATORIO MORFOLÓGICO</div><h3>Desarma la palabra</h3><p>Identifica la base, el sufijo y el cambio de vocales. Los bloques explican la <b>estructura gramatical</b>, no una concatenación literal de letras.</p><div class="gs-explorer"><div><span class="gs-mini-label">FORMA COMPLETA</span><div class="gs-hero-he">${gsHeb(e.he)}</div><b class="gs-meaning">${esc(e.es)}</b></div><div class="gs-parts">${e.parts.map((p,i)=>`<div class="gs-part" data-part="${i}"><span>${gsHeb(p[0])}</span><small>${esc(p[1])}</small></div>`).join('')}</div><p class="gs-note">${esc(e.note)}</p></div><div class="gs-example-footer"><span>Ejemplo ${gs.exp+1} de ${u.explore.length}</span><div><button class="gs-mini-btn" data-gs="explore" data-step="-1" ${gs.exp===0?'disabled':''}>← Anterior</button><button class="gs-mini-btn gs-next" data-gs="explore" data-step="1" ${gs.exp===u.explore.length-1?'disabled':''}>Siguiente →</button></div></div><div class="gs-inline-actions"><button class="gs-btn" data-gs="mode" data-mode="entrenar">Practicar ahora →</button></div></div>`}
function gsQuestion(u){if(gs.q>=u.questions.length)return gsResult(u);const q=u.questions[gs.q],done=gs.answered,ans=gs.value,ok=q.kind==='choice'?ans===q.correct:q.kind==='type'?q.answers.some(a=>gsNorm(a)===gsNorm(ans||'')):gs.pieces.join(',')===q.order.join(',');let opts='';if(q.kind==='choice'){opts=`<div class="gs-answers">${q.options.map((o,i)=>`<button data-gs="choice" data-index="${i}" class="gs-answer ${done?(i===q.correct?'is-correct':ans===i?'is-incorrect':''):''}" ${done?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${gsFmt(o)}</button>`).join('')}</div>`}
if(q.kind==='type'){opts=`<div class="gs-input-card"><label for="gs-hebrew-answer">Tu respuesta en hebreo (con o sin vocales)</label><input id="gs-hebrew-answer" dir="rtl" lang="he" autocomplete="off" spellcheck="false" placeholder="Escribe aquí…" value="${esc(done?ans||'':'')}" ${done?'disabled':''}><small>Se aceptan las respuestas sin niqqud, pero intenta escribirlas vocalizadas.</small>${!done?'<button class="gs-btn" data-gs="write">Comprobar respuesta</button>':''}</div>`}
if(q.kind==='build'){let seq=gs.pieces.map(i=>q.pieces[i][0]);opts=`<div class="gs-builder"><span class="gs-mini-label">TU CONSTRUCCIÓN · TOCA LOS BLOQUES PARA QUITARLOS</span><div class="gs-built" id="gs-built">${seq.length?seq.map((t,n)=>`<button data-gs="pop" data-index="${n}">${gsHeb(t)}</button>`).join(''):'<span class="gs-placeholder">Selecciona los componentes en orden</span>'}</div><span class="gs-mini-label">PIEZAS DISPONIBLES</span><div class="gs-builder-pieces">${q.pieces.map((p,i)=>`<button data-gs="piece" data-index="${i}" ${gs.pieces.includes(i)||done?'disabled':''}>${gsHeb(p[0])}<small>${esc(p[1])}</small></button>`).join('')}</div>${!done?'<div class="gs-inline-actions"><button class="gs-btn" data-gs="check-build">Verificar construcción</button><button class="gs-btn gs-outline" data-gs="clear-build">Borrar</button></div>':''}<small>Forma final esperada: se mostrará después de comprobar.</small></div>`}
return `<div class="gs-surface"><div class="gs-eyebrow">04 · APRENDE HACIENDO</div><div class="gs-drill-top"><div><h3>Práctica guiada</h3><p>Ejercicio ${gs.q+1} de ${u.questions.length} · ${q.kind==='type'?'Escritura':q.kind==='build'?'Construcción':'Identificación'}</p></div><span class="gs-round">${gs.results.filter(Boolean).length}/${gs.q+1} aciertos</span></div><div class="gs-round-track"><span style="width:${gs.q/u.questions.length*100}%"></span></div><div class="gs-prompt">${gsFmt(q.q)}</div>${opts}${done?`<div class="gs-feedback ${ok?'is-ok':'is-no'}" role="status"><b>${ok?'✓ ¡Bien identificado!':'↻ Revisemos juntos'}</b><p>${gsFmt(q.why)}</p>${!ok?`<p><strong>Respuesta:</strong> ${q.kind==='choice'?gsFmt(q.options[q.correct]):q.kind==='type'?gsHeb(q.answers[0]):gsHeb(q.result)}</p>`:''}</div><div class="gs-inline-actions"><button class="gs-btn" data-gs="next">${gs.q===u.questions.length-1?'Ver mi resultado →':'Siguiente ejercicio →'}</button></div>`:''}<div class="gs-drill-help">Cada respuesta se corrige al instante. Si no llegas al 80 %, podrás repetir la práctica.</div></div>`}
function gsResult(u){let right=gs.results.filter(Boolean).length;let pct=Math.round(right/u.questions.length*100);return `<div class="gs-surface gs-finish"><div class="gs-medal">${pct>=80?'🏆':'📚'}</div><h3>${pct>=80?'¡Unidad dominada!':'Sigue entrenando'}</h3><div class="gs-final-number">${pct}%</div><p>${right} de ${u.questions.length} respuestas correctas.</p><p>${pct>=80?'Has alcanzado el mínimo del 80 %. Puedes avanzar a la siguiente unidad.':'Repasa la teoría y vuelve a practicar para desbloquear el siguiente nivel.'}</p><div class="gs-inline-actions"><button class="gs-btn" data-gs="retry">Repetir práctica</button><button class="gs-btn gs-outline" data-gs="mode" data-mode="teoria">Repasar teoría</button>${pct>=80&&gs.unit<2?`<button class="gs-btn" data-gs="unit" data-index="${gs.unit+1}">Siguiente unidad →</button>`:''}</div></div>`}
function gsVerses(){const p=GS_PASSAGES[gs.verse],t=p.tokens[gs.token];return `<div class="gs-surface"><div class="gs-eyebrow">05 · DETECTIVE BÍBLICO</div><h3>Reconoce lo aprendido en las Escrituras</h3><p>Selecciona un pasaje y toca cada palabra o grupo hebreo para identificar su función. Empieza buscando los sufijos pronominales.</p><div class="gs-verse-switch">${GS_PASSAGES.map((x,i)=>`<button data-gs="verse" data-index="${i}" class="${gs.verse===i?'on':''}">${x.ref}</button>`).join('')}</div><div class="gs-verse"><b>${p.ref}</b><small>${p.detail}</small><div class="gs-verse-words" dir="rtl">${p.tokens.map((x,i)=>`<button lang="he" dir="rtl" data-gs="token" data-index="${i}" class="gs-token ${gs.token===i?'selected':''} ${/Sustantivo con sufijo|Verbo con sufijo|Preposición con sufijo/.test(x[1])?'has-suffix':''}">${esc(x[0])}</button>`).join('')}</div></div>${t?`<div class="gs-verse-answer" role="status"><span class="gs-mini-label">PALABRA SELECCIONADA</span><div class="gs-verse-answer-row">${gsHeb(t[0])}<span>${esc(t[1])}</span></div><p>${esc(t[2])}</p></div>`:`<div class="gs-empty-tip">☝️ Toca una expresión del texto: recibirás su categoría y una explicación.</div>`}<div class="gs-legend"><span><i class="gs-dot suf"></i> Expresiones con sufijos resaltadas</span><span><i class="gs-dot"></i> Otras formas gramaticales</span></div><div class="gs-inline-actions"><button class="gs-btn" data-gs="mode" data-mode="entrenar">Comenzar práctica evaluada →</button></div></div>`}
function gsSource(){return `<details class="gs-source"><summary>📚 Material y referencias gramaticales</summary><p><b>Material de clase:</b> «Pronombres personales y demostrativos y sufijos pronominales», Mg. David Asmat Chávez, pp. 11–28 (tablas) y 29–36 (análisis y traducción); y «El sustantivo y pronombres» (estado constructo).</p><p><b>Ampliación consultada:</b> <a href="https://bcresources.net/hebrew-ncbc-grammar/" target="_blank" rel="noopener noreferrer">ncBc Grammar · Pronominal Suffixes §4</a> y <a href="https://biblicalhebrew.org/pronominal-suffixes.aspx" target="_blank" rel="noopener noreferrer">Gesenius, Pronominal Suffixes</a>. El contenido didáctico funciona sin conexión; los enlaces externos requieren internet.</p><p>Nota: la pronunciación sintética del navegador no sustituye la lectura académica de hebreo bíblico. Algunas formas pueden presentar variantes contextuales.</p></details>`}
function vGSuf(){const root=activeView();if(!root)return;gs.unit=Math.max(0,Math.min(2,gs.unit));const u=GS_DATA[gs.unit];root.classList.add('gs-host');root.innerHTML=`<div class="gs-app"><div class="gs-intro"><span class="gs-tag">GRAMÁTICA · RUTA DE DOMINIO</span><div class="gs-intro-row"><div><h2>Los sufijos, <em>paso a paso.</em></h2><p>Aprende cómo cambian los sustantivos, las preposiciones y las partículas. Memoriza sus paradigmas y aplícalos en textos bíblicos.</p></div><div class="gs-intro-art" aria-hidden="true"><span>קוֹלִי</span><span>לִי</span><span>אֹתִי</span></div></div><div class="gs-overview">${GS_DATA.map((x,i)=>`<button class="gs-unit ${gs.unit===i?'active':''} ${!gsCanGo(i)?'locked':''}" data-gs="unit" data-index="${i}" ${!gsCanGo(i)?'disabled':''} aria-current="${gs.unit===i?'step':'false'}"><span class="gs-unit-ico">${x.icon}</span><span class="gs-unit-copy"><b>${i+1}. ${x.short}</b><small>${!gsCanGo(i)?'🔒 Completa el nivel anterior':(gs.best[i]||0)>=80?'✓ Aprobado':'Nivel '+(i+1)+' · '+(gs.best[i]||0)+'% mejor nota'}</small></span></button>`).join('')}</div></div><div class="gs-current"><div><span class="gs-mini-label">UNIDAD ${gs.unit+1} DE 3 · PDF PÁGS. ${u.pages}</span><h3>${u.icon} ${u.short}</h3><p>${esc(u.intro)}</p></div><span class="gs-master">${gs.best[gs.unit]||0}% <small>récord</small></span></div><div class="gs-modebar" aria-label="Etapas de aprendizaje">${[['teoria','1. Teoría'],['tablas','2. Paradigmas'],['desarmar','3. Desarmar'],['entrenar','4. Practicar'],['versiculos','5. En la Biblia']].map(([k,n])=>`<button data-gs="mode" data-mode="${k}" class="${gs.mode===k||gs.mode==='resultado'&&k==='entrenar'?'on':''}" aria-pressed="${gs.mode===k}">${n}</button>`).join('')}</div><div class="gs-main">${gs.mode==='teoria'?gsTheory(u):gs.mode==='tablas'?gsTables(u):gs.mode==='desarmar'?gsExplore(u):gs.mode==='versiculos'?gsVerses():gsQuestion(u)}</div>${gsSource()}<p class="gs-footer-note">Hebreo Bíblico I · Gramática aplicada · Contenido del curso y ampliaciones señaladas</p></div>`;
root.onclick=(e)=>{const b=e.target.closest('[data-gs]');if(!b||!root.contains(b))return;const action=b.dataset.gs;
 if(action==='mode')gsSelectMode(b.dataset.mode);
 if(action==='unit')gsSelectUnit(Number(b.dataset.index));
 if(action==='say')say(b.dataset.say);
 if(action==='explore'){gs.exp=Math.max(0,Math.min(GS_DATA[gs.unit].explore.length-1,gs.exp+Number(b.dataset.step)));gsStore();vGSuf()}
 if(action==='verse'){gs.verse=Number(b.dataset.index);gs.token=-1;gsStore();vGSuf()}
 if(action==='token'){gs.token=Number(b.dataset.index);vGSuf()}
 if(action==='choice')gsSubmit(Number(b.dataset.index));
 if(action==='write'){const inp=root.querySelector('#gs-hebrew-answer');if(!inp||!inp.value.trim()){inp?.focus();return}gsSubmit(inp.value.trim())}
 if(action==='piece'){let n=Number(b.dataset.index);if(!gs.pieces.includes(n)){gs.pieces.push(n);vGSuf()}}
 if(action==='pop'){gs.pieces.splice(Number(b.dataset.index),1);vGSuf()}
 if(action==='clear-build'){gs.pieces=[];vGSuf()}
 if(action==='check-build'){if(gs.pieces.length!==GS_DATA[gs.unit].questions[gs.q]?.pieces?.length){return}gsSubmit(gs.pieces.join(','))}
 if(action==='next'){gs.q++;gs.answered=false;gs.value=null;gs.pieces=[];if(gs.q>=GS_DATA[gs.unit].questions.length){const score=Math.round(100*gs.results.filter(Boolean).length/GS_DATA[gs.unit].questions.length);gs.best[gs.unit]=Math.max(gs.best[gs.unit]||0,score);gsStore()}vGSuf()}
 if(action==='retry')gsSelectMode('entrenar');
};
root.onkeydown=(e)=>{if(e.key==='Enter'&&e.target.id==='gs-hebrew-answer'&&!gs.answered){e.preventDefault();root.querySelector('[data-gs="write"]')?.click()}};
}
function gsSubmit(value){if(gs.answered)return;const q=GS_DATA[gs.unit].questions[gs.q];if(!q)return;let ok=q.kind==='choice'?value===q.correct:q.kind==='type'?q.answers.some(a=>gsNorm(a)===gsNorm(value)):gs.pieces.join(',')===q.order.join(',');gs.answered=true;gs.value=value;gs.results[gs.q]=ok;vGSuf()}

const QT_DETAILS={"qal":{"id":"qal","tag":"La forma básica","subtitle":"La acción se enuncia sin el prefijo derivativo de los otros patrones.","role":"El sujeto normalmente hace la acción («guardó») o se encuentra en un estado («era pesado»).","summary":"Qal es el patrón más frecuente y suele expresar el significado básico de una raíz. No significa necesariamente «débil» ni «poco intenso». También puede ser estativo: describe cómo es o está alguien o algo.","detect":["Identifica las tres consonantes de la raíz; en el modelo קָטַל no se añade נִ־, הִ־ ni הִתְ־.","En el perfecto 3ms fuerte suele verse el esquema de vocales a–a, aunque hay modelos estativos con otras vocales.","Comprueba la terminación: la forma 3ms no agrega sufijo personal. Otras personas sí lo reciben."],"steps":["Busca las consonantes radicales del verbo.","Observa que no aparece un prefijo típico de otro binyan.","Analiza el contexto: ¿es acción simple («creó») o un estado?"],"heb":"בָּרָא","reading":"bará","translation":"«él creó»","analysis":"Génesis 1:1. Raíz ב־ר־א; Qal, qatal/perfecto, tercera persona masculina singular. El sujeto es אֱלֹהִים. El verbo presenta la creación como acción completa en ese relato.","compare":"Frente al Nifal, Qal suele presentar al sujeto como ejecutor, no como receptor de la acción.","trap":"No clasifiques cualquier verbo sin prefijo como Qal: Piel y Pual tampoco llevan necesariamente prefijos en perfecto 3ms. Mira las vocales y el dagesh.","exam":"בָּרָא → raíz ברא · Qal · perfecto · 3ms · «creó».","question":"En Génesis 1:1, ¿por qué בָּרָא se analiza como Qal perfecto 3ms?","choices":["Contiene el prefijo נִ־ del Nifal","Tiene la forma léxica Qal sin sufijo personal","Contiene el prefijo הִתְ־ del Hitpael"],"answer":1,"why":"בָּרָא sigue la forma Qal 3ms de la raíz ברא, sin sufijo de persona ni prefijo derivativo."},"nifal":{"id":"nifal","tag":"Acción recibida o situación del sujeto","subtitle":"La «n» inicial del perfecto suele ayudarte a detectarlo.","role":"El sujeto puede recibir una acción («fue hallado»), verse implicado en ella o aparecer en un estado.","summary":"Nifal suele ser pasivo de Qal, pero también puede expresar valores medios, reflexivos, recíprocos, estativos o léxicos propios. La traducción depende de la raíz concreta y del contexto.","detect":["En el perfecto regular 3ms, busca נִ־ al inicio: נִקְטַל.","Observa la vocal i bajo נ y la estructura del resto del verbo; el prefijo no siempre se conserva en otras conjugaciones.","Pregunta si el sujeto realiza, recibe o experimenta la acción. Contrasta con el Qal de la misma raíz cuando exista."],"steps":["Separa נִ־ del resto del patrón en un perfecto regular.","Reconoce la raíz después del prefijo.","Decide por el contexto si la forma es pasiva, media, reflexiva o un sentido propio del verbo."],"heb":"נִמְצָא","reading":"nimtsá","translation":"«fue hallado / se encontró»","analysis":"Raíz מ־צ־א («encontrar»). Modelo real de Nifal perfecto 3ms. Puede funcionar como pasivo o como estado («se hallaba»), según el contexto.","compare":"מָצָא «encontró» (Qal) frente a נִמְצָא «fue hallado / se encontró» (Nifal). El sujeto cambia de papel.","trap":"No traduzcas todos los Nifal por «fue + participio»: algunas raíces tienen valores medios o incluso sentidos lexicalizados.","exam":"נִמְצָא → raíz מצא · Nifal · perfecto · 3ms · «fue hallado / se halló».","question":"¿Qué función tiene normalmente נִ־ en נִקְטַל (perfecto 3ms regular)?","choices":["Es siempre el artículo definido","Marca el femenino plural","Señala el patrón Nifal"],"answer":2,"why":"La נ con jireq al inicio es señal característica del Nifal perfecto regular; la interpretación precisa depende del verbo."},"piel":{"id":"piel","tag":"Acción activa de sentido derivado","subtitle":"El dagesh en la segunda radical es una señal importante.","role":"El sujeto realiza una acción cuyo significado puede ser simple, resultativo, factitivo, reiterativo u otro.","summary":"Piel es un patrón activo muy flexible. A veces expresa intensificación o produce un estado; otras veces es simplemente la forma habitual de un verbo, como דִּבֶּר («habló»). No se debe añadir «muy» a la traducción automáticamente.","detect":["Busca normalmente jireq (ִ) bajo la primera radical del perfecto 3ms fuerte: קִטֵּל.","Fíjate en el dagesh fuerte dentro de la segunda consonante radical: קִטֵּל.","Compara con Pual: ambos pueden duplicar la segunda radical, pero Pual lleva habitualmente quibuts inicial (ֻ)."],"steps":["Localiza la raíz y la vocal de la primera radical.","Busca la duplicación (dagesh) de la consonante central, cuando sea visible.","Consulta el significado propio del verbo en Piel; no inventes una intensidad."],"heb":"דִּבֶּר","reading":"dibér","translation":"«él habló»","analysis":"Génesis 12:4. Raíz ד־ב־ר. Piel, perfecto, 3ms. Observa la vocal i y el dagesh en בּ; el significado corriente es «habló», no «habló muchísimo».","compare":"Piel suele ser activo; Pual suele expresar el pasivo de lo que significa esa raíz en Piel.","trap":"Si la segunda radical es gutural, no siempre aparece el dagesh visible. Tampoco todos los verbos en Piel son «intensivos».","exam":"דִּבֶּר → raíz דבר · Piel · perfecto · 3ms · «habló».","question":"¿Cuál afirmación describe mejor דִּבֶּר en Génesis 12:4?","choices":["Piel perfecto; se traduce «habló»","Pual perfecto; se traduce «fue hablado»","Hitpael perfecto; se traduce «se habló a sí mismo»"],"answer":0,"why":"La forma דִּבֶּר muestra vocal i y dagesh central, propios del Piel regular. Su significado léxico es «habló»."},"pual":{"id":"pual","tag":"La contraparte pasiva de Piel","subtitle":"Mira la vocal u inicial más el dagesh de la consonante central.","role":"El sujeto recibe la acción que normalmente se expresaría en Piel.","summary":"Pual es por lo general el patrón pasivo correspondiente a Piel. En español solemos traducirlo mediante «fue + participio» o una construcción pasiva apropiada. El contexto determina la mejor traducción.","detect":["En el perfecto 3ms regular, identifica quibuts (ֻ), una vocal u bajo la primera radical: קֻטַּל.","Busca el dagesh de la segunda radical, cuando pueda escribirse.","No lo confundas con Hofal: Hofal suele presentar un prefijo הָ־ / הֻ־."],"steps":["Identifica la vocal u inicial del modelo.","Comprueba el patrón con duplicación central y sin prefijo ה derivativo.","Reconoce que la acción recae sobre el sujeto y traduce según la raíz."],"heb":"כֻּפַּר","reading":"kuppár","translation":"«fue expiado / se hizo expiación»","analysis":"Raíz כ־פ־ר. Modelo de Pual perfecto 3ms asociado a כִּפֵּר (Piel, «hizo expiación»). Es un ejemplo gramatical; el sentido exacto depende del complemento y del contexto.","compare":"כִּפֵּר (Piel: «hizo expiación») → כֻּפַּר (Pual: «fue expiado»). Cambia de orientación activa a pasiva.","trap":"Que lleve vocal u no basta por sí solo para identificar un Pual: observa la estructura entera y la segunda radical.","exam":"כֻּפַּר → raíz כפר · Pual · perfecto · 3ms · «fue expiado».","question":"¿Qué contraste es normal entre Piel y Pual?","choices":["Piel señala plural y Pual singular","Piel es imperativo y Pual siempre imperfecto","Piel suele ser activo y Pual su pasivo"],"answer":2,"why":"Piel y Pual son patrones verbales, no marcas de persona o de tiempo; Pual corresponde normalmente a la voz pasiva de Piel."},"hifil":{"id":"hifil","tag":"Causativa activa","subtitle":"El sujeto provoca un resultado o hace suceder algo.","role":"El sujeto causa o hace que otra persona/cosa experimente una acción, aunque algunos verbos tienen un significado establecido propio.","summary":"Hifil suele expresar causación: «hacer que ocurra» una acción. En muchas raíces produce verbos transitivos o resultado. La explicación es una guía, no una traducción fija para todas las palabras.","detect":["En el modelo regular del perfecto 3ms aparece הִ־ antes de la raíz: הִקְטִיל.","Suele haber vocal i (jireq, a menudo con yod) antes de la última radical: הִקְטִיל.","Las raíces débiles pueden cambiar mucho la forma; por ejemplo, הֵבִיא se aparta del esquema fuerte."],"steps":["Busca un prefijo הִ־ (o una variante propia de la raíz).","Comprueba la estructura interna típica de Hifil; no te quedes únicamente con ה inicial.","Identifica quién provoca el resultado y traduce el sentido real del verbo."],"heb":"הֵבִיא","reading":"heví","translation":"«él trajo»","analysis":"Raíz ב־ו־א (verbo débil בוא, «venir»). Hifil, perfecto, 3ms. El valor causativo se expresa de forma natural como «traer»: hacer venir algo o a alguien.","compare":"הֵבִיא «trajo» (Hifil activo) frente a הוּבָא «fue traído» (Hofal pasivo).","trap":"No exijas siempre el esquema exacto הִקְטִיל: raíces débiles presentan cambios. Tampoco traduzcas todos los Hifil como «hizo hacer».","exam":"הֵבִיא → raíz בוא · Hifil · perfecto · 3ms · «trajo».","question":"¿Qué relación expresa normalmente Hifil?","choices":["El sujeto siempre hace la acción sobre sí mismo","El sujeto causa una acción o un resultado","El sujeto necesariamente recibe una acción pasiva"],"answer":1,"why":"Hifil suele ser causativo activo: el sujeto provoca o produce el resultado, aunque cada verbo tiene un significado léxico propio."},"hofal":{"id":"hofal","tag":"Causativa pasiva","subtitle":"El resultado provocado recae sobre el sujeto.","role":"El sujeto es la persona o cosa que recibe una acción causativa: «fue llevado / fue traído».","summary":"Hofal es generalmente el pasivo de Hifil. Cuando el Hifil es «traer», el Hofal puede ser «ser traído». En el perfecto, los modelos pueden aparecer con הָ־ (qamets reducido, sonido o) o הֻ־.","detect":["Busca el prefijo הָ־ (qamets qatan, pronunciado o en estos modelos) o הֻ־ (quibuts): הָקְטַל / הֻקְטַל.","En contraste con Hifil, no suele aparecer la secuencia vocal característica hi–i.","Comprueba el significado pasivo con la raíz en cuestión."],"steps":["Busca el prefijo הָ־ / הֻ־ y su vocalización.","Contrástalo con el Hifil de esa misma raíz.","Traduce como acción recibida cuando corresponda: «fue llevado», «fue traído»."],"heb":"הוּבָא","reading":"huvá","translation":"«fue traído»","analysis":"Raíz ב־ו־א. Hofal, perfecto, 3ms. Es el contrapunto pasivo de הֵבִיא («trajo»); la forma es irregular respecto al modelo de raíz fuerte.","compare":"הֵבִיא (Hifil) «trajo» → הוּבָא (Hofal) «fue traído». El resultado es semejante; cambia el papel del sujeto.","trap":"La vocalización del prefijo puede variar; הָ־ de Hofal no se debe leer automáticamente como «ha» (a menudo se trata de qamets qatan).","exam":"הוּבָא → raíz בוא · Hofal · perfecto · 3ms · «fue traído».","question":"Si הֵבִיא significa «trajo», ¿qué expresa normalmente הוּבָא?","choices":["«Fue traído», Hofal pasivo","«Traeré», Hifil imperfecto","«Se trajo a sí mismo», Hitpael"],"answer":0,"why":"הוּבָא es Hofal perfecto 3ms de בוא; expresa el pasivo de «trajo»."},"hitpael":{"id":"hitpael","tag":"Acción reflexiva, recíproca o media","subtitle":"La marca הִתְ־ suele ser la pista más evidente.","role":"El sujeto se involucra de una manera especial en la acción; puede actuar sobre sí mismo, mutuamente con otros o realizar una acción media.","summary":"Hitpael se relaciona formalmente con Piel y suele expresar reflexividad («se preparó»), reciprocidad («se encontraron unos con otros») o acción media. Sin embargo, algunas raíces tienen sentidos convencionales no reflexivos, como «andar».","detect":["En el perfecto regular 3ms busca הִתְ־: הִתְקַטֵּל.","Es habitual la duplicación de la segunda radical (dagesh), cuando las consonantes la permiten.","Con sibilantes (por ejemplo שׁ, שׂ, ס, צ, ז) puede haber cambios de orden o asimilación; no siempre verás literalmente הִתְ־ intacto."],"steps":["Localiza הִתְ־ o una variante del prefijo.","Identifica la raíz y examina la duplicación central del patrón.","No traduzcas automáticamente con «se»: comprueba si es reflexivo, recíproco o sentido establecido."],"heb":"הִתְהַלֵּךְ","reading":"hithaléj","translation":"«anduvo / caminó de un lado a otro»","analysis":"Raíz ה־ל־ך («ir, andar»). Hitpael perfecto 3ms. La forma puede describir un caminar reiterado o un desplazamiento continuo; no significa necesariamente «se caminó a sí mismo».","compare":"Piel y Hitpael pueden compartir duplicación central; Hitpael añade un elemento prefijal de tipo הִתְ־ en el perfecto regular.","trap":"El prefijo הִתְ־ orienta la identificación, pero no obliga a traducir el verbo con pronombre reflexivo «se» en español.","exam":"הִתְהַלֵּךְ → raíz הלך · Hitpael · perfecto · 3ms · «anduvo».","question":"¿Cuál es la mejor regla para traducir un Hitpael?","choices":["Añadir siempre «se» a cualquier verbo","Traducirlo siempre como una voz pasiva de Hifil","Examinar la raíz y el contexto; puede ser reflexivo, recíproco o medio"],"answer":2,"why":"Hitpael es flexible. Su prefijo ayuda a reconocer la forma, pero no determina por sí solo una traducción reflexiva."}};

function qtSevenOverview(){return `<section class="qt-box qt-deep-intro"><span class="qt-eyebrow">LECCIONES DE COMPRENSIÓN · SIETE VOCES</span><h2>Una voz a la vez, desde cero</h2><p>Abre cada capítulo para comprender cómo se identifica y qué expresa. La explicación extendida está en la etapa <b>Las 7 voces</b>. <b>${Object.values(qtGet().micro||{}).filter(Boolean).length}/7 mini retos acertados.</b></p><div class="qt-lesson-list">${QT_STEMS.map((s,i)=>{const d=QT_DETAILS[s.id];return `<details class="qt-lesson-accordion"><summary><span class="qt-chapter-num">${String(i+1).padStart(2,'0')}</span><span class="qt-chapter-title"><strong>${s.name}</strong><small>${d.tag}</small></span>${qtHe(s.he,'qt-accordion-he')}</summary><div class="qt-lesson-body"><p>${qtEsc(d.summary)}</p><p><b>Cómo reconocerlo:</b> ${qtEsc(d.detect[0])}</p><p><b>Ejemplo:</b> ${qtHe(d.heb)} · ${qtEsc(d.translation)}</p>${qtDeepStudyButton(d)}</div></details>`}).join('')}</div></section><section class="qt-box qt-glossary"><span class="qt-eyebrow">DICCIONARIO BÁSICO</span><h2>Palabras técnicas que necesitas comprender</h2><div class="qt-gloss-grid">${[['Activa','El sujeto ejecuta o inicia la acción: «el rey llamó».'],['Pasiva','El sujeto recibe la acción: «el rey fue llamado».'],['Reflexiva','El sujeto realiza una acción que recae sobre sí mismo: «se preparó».'],['Recíproca','Dos o más sujetos actúan unos sobre otros: «se saludaron».'],['Causativa','El sujeto provoca que suceda algo: «hizo salir».'],['Media / estativa','La forma describe participación, proceso o estado; no siempre encaja en activa o pasiva.']].map(x=>`<div><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><div class="qt-deep-warning"><b>Importante:</b> no debes decidir el significado solo por el nombre del patrón. Identifica <b>raíz + binyan + conjugación + persona</b> y después revisa el contexto.</div></section>`}

function qtIntro(){return `<div class="qt-two"><section class="qt-box"><span class="qt-eyebrow">EMPIEZA POR LA IDEA CENTRAL</span><h2>Qatal es una conjugación; Qal es un patrón.</h2><p>Los verbos hebreos combinan dos informaciones distintas: <b>cómo se presenta la acción</b> (conjugación: <i>qatal/perfecto</i>) y <b>qué relación tiene el sujeto con la acción</b> (patrón o <i>binyan</i>).</p><div class="qt-example-split"><div><span>QAL · PERFECTO · 3MS</span>${qtHe('שָׁמַר')}<strong>Él guardó</strong></div><div><span>QAL · PERFECTO · 1CS</span>${qtHe('שָׁמַרְתִּי')}<strong>Yo guardé</strong></div></div><p>El perfecto suele describir una acción como completa; <b>no equivale automáticamente al pasado español</b>. En contexto puede traducirse en presente o futuro.</p><div class="qt-actions"><button class="qt-btn" data-stepgo="stems">Conocer las siete voces →</button><button class="qt-btn qt-outline" data-stepgo="prof">Material del profesor · PDF →</button></div></section><aside class="qt-box qt-soft"><span class="qt-eyebrow">PARA NO CONFUNDIRTE</span><h3>3 preguntas para analizar un verbo</h3><div class="qt-steps"><div><em>1</em><p><b>¿Cuál es la raíz?</b><br>Identifica las consonantes fundamentales: שׁ־מ־ר, «guardar».</p></div><div><em>2</em><p><b>¿Qué patrón tiene?</b><br>Fíjate en נִ־, הִ־, הִתְ־, las vocales y el dagesh.</p></div><div><em>3</em><p><b>¿Quién realiza la acción?</b><br>La terminación del qatal señala persona, género y número.</p></div></div><div class="qt-callout">💡 <b>Examen:</b> escribe «Qal · perfecto · 1cs» para analizar ${qtHe('שָׁמַרְתִּי')}.</div></aside></div><div class="qt-summaries"><div class="qt-short" style="--qt-tint:var(--v4-aqua-soft)"><b>Conjugación</b><span>Qatal (perfecto)</span><small>Presenta la acción en su conjunto.</small></div><div class="qt-short" style="--qt-tint:var(--v4-sky)"><b>Patrón verbal</b><span>Qal / Nifal / Piel…</span><small>Indica la relación con la acción.</small></div><div class="qt-short" style="--qt-tint:var(--v4-peach)"><b>Terminación</b><span>־תִּי / ־תָּ / ־וּ…</span><small>Identifica sujeto, género y número.</small></div></div><section class="qt-box qt-reminder"><h3>Recuerda antes del examen</h3><p>En los textos bíblicos, <b>וַיֹּאמֶר</b> y <b>וַיֵּלֶךְ</b> son formas <i>wayyiqtol</i>; no debes analizarlas como qatal solo porque estén traducidas en pasado.</p><button class="qt-btn qt-outline" data-stepgo="bible">Ver la diferencia en Génesis →</button></section>${qtSevenOverview()}`}
function qtStems(){const visible=QT_STEMS.filter(g=>qtTabFilter==='todos'||g.family===qtTabFilter);const g=QT_STEMS.find(x=>x.id===qtSelectedStem)||QT_STEMS[0];return `<div class="qt-section-header"><div><span class="qt-eyebrow">SIETE BINYANIM · PERFECTO 3.ª MASCULINO SINGULAR</span><h2>Compara el mismo modelo verbal</h2><p>Elige una voz para abrir su clase completa: formación, significado, ejemplo, errores frecuentes y mini reto. Los patrones siguen la raíz modelo ק־ט־ל.</p></div><span class="qt-count">7 formas</span></div><div class="qt-filter">${[['todos','Todas'],['activa','Activas'],['pasiva','Pasivas / medias'],['reflexiva','Reflexiva']].map(v=>`<button data-qt-filter="${v[0]}" class="${v[0]===qtTabFilter?'on':''}">${v[1]}</button>`).join('')}</div><div class="qt-stems">${visible.map((x,i)=>`<button class="qt-stem ${qtSelectedStem===x.id?'selected':''}" data-qt-stem="${x.id}" aria-pressed="${qtSelectedStem===x.id}"><small>${x.type}</small>${qtHe(x.he)}<strong>${x.name}</strong><span>${x.marker}</span></button>`).join('')}</div><section class="qt-box qt-stem-detail" aria-live="polite"><div class="qt-detail-head"><div><span class="qt-eyebrow">ANATOMÍA DEL PATRÓN</span><h3>${g.name} <span class="qt-phonetic">(${g.tr})</span></h3></div><div class="qt-he-feature">${qtHe(g.he)}</div></div><div class="qt-detail-grid"><div><b>Cómo reconocerlo</b><p>${g.marker}</p></div><div><b>Qué suele expresar</b><p>${g.sense}</p></div><div><b>Truco para memorizarlo</b><p>${g.memory}</p></div><div><b>Ejemplo</b><p>${qtHe(g.real)} — ${g.realEs}</p></div></div><div class="qt-callout">📖 ${g.verse}</div>${qtDetailedStem(g)}<div class="qt-actions"><button class="qt-btn" data-stepgo="conj">Ahora aprende las terminaciones →</button><button class="qt-btn qt-outline" data-qt-he-say="${g.he}">♫ Escuchar modelo</button></div></section>`}
function qtConj(){return `<div class="qt-section-header"><div><span class="qt-eyebrow">QAL PERFECTO · RAÍZ שׁ־מ־ר (GUARDAR)</span><h2>Aprende a conjugar, persona por persona</h2><p>En qatal las terminaciones personales se añaden al verbo; los patrones vocálicos se ajustan según la forma.</p></div><span class="qt-count">9 formas</span></div><div class="qt-conj-top"><div class="qt-box qt-conj-hero"><span>FORMA MODELO · 3MS</span>${qtHe('שָׁמַר')}<b>shamar · «él guardó»</b><p>Raíz: <strong>שׁ־מ־ר</strong>. Observa cómo cambian la terminación y, en algunas formas, las vocales.</p><button class="qt-btn qt-outline" data-qt-toggle>${qtShowTranslation?'Ocultar traducciones':'Mostrar traducciones'}</button></div><div class="qt-box qt-conj-tip"><h3>Las terminaciones que más salen en exámenes</h3><div class="qt-endings">${[['־תִּי','yo'],['־תָּ','tú m.'],['־תְּ','tú f.'],['־נוּ','nosotros'],['־וּ','ellos/ellas'],['־תֶּם','ustedes m.']].map(x=>`<div>${qtHe(x[0])}<small>${x[1]}</small></div>`).join('')}</div><p class="qt-note">Las formas 2mp/2fp comienzan con shewa: שְׁמַרְתֶּם / שְׁמַרְתֶּן.</p></div></div><div class="qt-box qt-tablebox"><div class="qt-table-scroll"><table class="qt-table"><thead><tr><th>Persona</th><th>Hebreo</th><th>Terminación</th><th>${qtShowTranslation?'Significado':'¿Lo recuerdas?'}</th></tr></thead><tbody>${QT_FORMS.map(f=>`<tr><td><b>${f.id}</b><small>${f.person}</small></td><td>${qtHe(f.he)}</td><td>${qtHe(f.end)}</td><td><span class="${qtShowTranslation?'':'qt-obscured'}">${f.es}</span></td></tr>`).join('')}</tbody></table></div></div><div class="qt-callout">🧠 <b>Regla de oro:</b> el perfecto recibe sufijos para persona, género y número. La forma 3ms suele no tener sufijo. En 3cp no se distingue masculino y femenino.</div><div class="qt-actions"><button class="qt-btn" data-stepgo="quiz">Practicar las terminaciones →</button><button class="qt-btn qt-outline" data-stepgo="bible">Buscar qatal en Génesis ↗</button></div>`}
function qtQuestionBank(){const q=[];const add=(mode,kind,prompt,choices,answer,why,extra={})=>q.push({id:'qt'+(q.length+1),mode,kind,prompt,choices,answer,why,...extra});
 // Stems: 7 + 7 recognition questions
 const wrongStems=QT_STEMS.map(x=>x.name);
 QT_STEMS.forEach((x,i)=>{const choices=[x.name,...QT_STEMS.filter(t=>t.id!==x.id).slice(i%4,i%4+3).map(t=>t.name)];while(choices.length<4)choices.push(wrongStems[choices.length]);add('patrones','choose',`¿Qué patrón representa ${qtHe(x.he)}?`,choices,x.name,`${x.he} es el modelo de ${x.name}. ${x.marker}.`)});
 QT_STEMS.forEach(x=>{const wrong=QT_STEMS.filter(t=>t.id!==x.id).slice(0,3).map(t=>t.he);add('patrones','choose',`Elige la forma modelo de ${x.name} en perfecto 3ms.`,[x.he,...wrong],x.he,`${x.name}: ${x.he}. ${x.type}.`)});
 // Nine people
 QT_FORMS.forEach(f=>{const others=QT_FORMS.filter(x=>x.id!==f.id).slice(0,3).map(x=>x.id);add('personas','choose',`Analiza la persona de ${qtHe(f.he)}.`,[f.id,...others],f.id,`${f.he} = ${f.es}; terminación ${f.end}.`)});
